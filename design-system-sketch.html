<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelloPrint UI kit — sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261107m">
<style>
  /* Sketch only: the kit's own chrome. Every example inside uses the real styles.css. */
  html, body { background: var(--white); }
  .ds-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--white); border-bottom: 1px solid var(--line); }
  .ds-top .logo { height: 24px; }
  .ds-top b { font-weight: 600; font-size: 14px; color: var(--dark-grey); padding-left: 16px; border-left: 1px solid var(--line); }
  .ds-top .seg { margin-left: auto; display: flex; gap: 8px; }
  .ds-menu-btn { display: none; }
  .ds { display: grid; grid-template-columns: 240px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
  .ds-side { position: sticky; top: 64px; align-self: start; height: calc(100vh - 64px); overflow-y: auto; padding: 32px 16px 32px 24px; }
  .ds-side h4 { margin: 24px 0 8px 12px; font-weight: 600; font-size: 12px; line-height: 17px; color: var(--dark-grey); }
  .ds-side h4:first-child { margin-top: 0; }
  .ds-side a { display: block; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 22px; color: var(--black); }
  .ds-side a:hover { color: #008539; }
  .ds-side a[aria-current] { background: var(--light-grey); font-weight: 600; }
  .ds-side a.soon { color: var(--mid-grey); pointer-events: none; }
  .ds-main { padding: 32px 48px 96px; min-width: 0; }
  .ds-sec { max-width: 880px; padding-bottom: 64px; scroll-margin-top: 96px; }
  .ds-sec + .ds-sec { padding-top: 64px; border-top: 1px solid var(--line); }
  .ds-sec > h1 { font-size: 32px; line-height: 40px; letter-spacing: -0.64px; }
  .ds-lead { margin-top: 8px; max-width: 640px; font-size: 16px; line-height: 24px; color: var(--dark-grey); }
  .ds-sec h3 { margin: 32px 0 8px; font-weight: 600; font-size: 16px; line-height: 22px; }
  .ds-stage { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: #fafafa; }
  .ds-stage .w { width: 260px; }
  .ds-stage .w > * { width: 100%; }
  code { font: 500 12px/17px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dark-green); background: var(--light-grey); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .ds-note { font-size: 14px; line-height: 22px; color: var(--dark-grey); }
  .ds-dont { margin-top: 4px; font-size: 12px; line-height: 18px; color: #c90e2e; }
  .ds .badge { position: static; display: inline-block; }
  .ds .d-rev-nav { position: static; }

  /* Colour swatch, shared by A/B/C */
  .sw { width: 100%; height: 64px; border-radius: 8px; border: 1px solid var(--line); }

  /* A = spec sheet: one stage with everything, then a table */
  .ds-table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: 14px; line-height: 22px; }
  .ds-table th { text-align: left; font-weight: 600; font-size: 12px; line-height: 17px; color: var(--dark-grey); padding: 0 16px 8px 0; border-bottom: 1px solid var(--line); }
  .ds-table td { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .ds-table td:first-child { font-weight: 600; white-space: nowrap; }
  .ds-table .dot { display: inline-block; width: 16px; height: 16px; margin: 3px 8px 0 0; vertical-align: top; border-radius: 4px; border: 1px solid var(--line); }
  .a-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; width: 100%; }
  .a-swatches .sw { height: 56px; }
  .a-swatches small { display: block; margin-top: 4px; font-size: 12px; line-height: 17px; color: var(--dark-grey); }

  /* B = side by side: example left, spec right, one row per item */
  .b-row { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .b-row:first-of-type { border-top: 1px solid var(--line); }
  .b-row .ds-stage { justify-content: center; min-height: 104px; }
  .b-row .sw { height: 104px; }
  .b-spec h5 { font-weight: 600; font-size: 16px; line-height: 22px; }
  .b-spec p { margin-top: 4px; }
  .b-spec .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* C = gallery: one card per item */
  .c-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .c-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--white); transition: box-shadow .15s; }
  .c-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .c-card .ds-stage { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; justify-content: center; min-height: 120px; }
  .c-card .sw { height: 120px; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); }
  .c-body { padding: 16px; }
  .c-body h5 { font-weight: 600; font-size: 16px; line-height: 22px; }
  .c-body .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .c-grid .ds-stage .w { width: 100%; }

  /* Mobile: sidebar becomes a drawer */
  @media (max-width: 900px) {
    .ds { grid-template-columns: 1fr; }
    .ds-top { gap: 8px; padding: 0 16px; }
    .ds-top .logo { height: 18px; }
    .ds-top b { display: none; }
    .ds-menu-btn { display: inline-flex; }
    .ds-side { position: fixed; top: 64px; left: 0; z-index: 25; width: 280px; background: var(--white); border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .2s; }
    .ds-side.open { transform: none; }
    .ds-main { padding: 24px 16px 64px; }
    .b-row { grid-template-columns: 1fr; gap: 16px; }
    .c-grid { grid-template-columns: 1fr 1fr; }
    .ds-table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<header class="ds-top">
  <button class="pill ds-menu-btn" id="dsMenu">Menu</button>
  <img class="logo" src="assets/logo-dark.svg" alt="HelloPrint">
  <b>UI kit</b>
  <div class="seg" role="group" aria-label="Show examples as">
    <button class="pill" data-view="m">Mobile</button>
    <button class="pill" data-view="d">Desktop</button>
  </div>
</header>

<div class="ds">
  <nav class="ds-side" id="dsSide">
    <h4>Foundations</h4>
    <a href="#colours">Colours</a>
    <a class="soon" href="#typography">Typography</a>
    <a class="soon" href="#spacing">Spacing &amp; grid</a>
    <a class="soon" href="#lines">Lines, corners &amp; shadows</a>
    <a class="soon" href="#icons">Icons</a>
    <h4>Components</h4>
    <a href="#buttons">Buttons &amp; pills</a>
    <a class="soon" href="#forms">Form elements</a>
    <a class="soon" href="#badges">Badges</a>
    <a class="soon" href="#tabs">Tabs</a>
    <a class="soon" href="#cards">Cards</a>
    <a class="soon" href="#accordion">Accordion / FAQ</a>
    <a class="soon" href="#options">PDP option cards</a>
    <a class="soon" href="#feedback">Toast &amp; sheet</a>
  </nav>

  <main class="ds-main" id="dsMain"></main>
</div>

<script>
  // ---------- Data (rules from docs/design-principles.md + decisions.md) ----------
  const ARROW = '<svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const root = getComputedStyle(document.documentElement);
  const tok = n => root.getPropertyValue(n).trim();   // read live from styles.css, so the kit follows the prototype

  const COLOURS = [
    { group: 'Brand', items: [
      { name: 'Dark green', token: '--dark-green', use: 'Header, headings, active pill, secondary button text' },
      { name: 'Light green', token: '--light-green', use: 'Primary button, chosen option outline, search button' },
      { name: 'Orange', token: '--orange', use: 'Commercial badges only (Most Popular, Best Seller…)' },
    ]},
    { group: 'Neutrals', items: [
      { name: 'Black', token: '--black', use: 'Titles, body text on article pages, labels that carry info' },
      { name: 'Dark grey', token: '--dark-grey', use: 'Sub text under a title, body text on category pages' },
      { name: 'Mid grey', token: '--mid-grey', use: 'Outline of controls: pills, secondary buttons, round arrows' },
      { name: 'Outline', token: '--outline', use: 'Outline of option cards (PDP)' },
      { name: 'Line', token: '--line', use: 'Every line: dividers, tab line, accordion, footer, card outlines' },
      { name: 'Light grey', token: '--light-grey', use: 'Grey tiles, USP bar, active menu item, neutral badge' },
      { name: 'White', token: '--white', use: 'Page and card background' },
    ]},
    { group: 'Found in the CSS, not a token yet', loose: true, items: [
      { name: 'Link green', value: '#008539', use: 'Inline links (underlined), breadcrumbs, link hover · used 14×' },
      { name: 'Tick green', value: '#00ad4c', use: 'Selling-point ticks on product cards · used 2×' },
      { name: 'Error red', value: '#c90e2e', use: 'Field error · used 4×. A second red #d0021b is used 2× on login' },
      { name: 'Selected tint', value: '#eefaf3', use: 'Background of a chosen address / payment / tile · used 3×' },
    ]},
  ];

  const BUTTONS = [
    { name: 'Primary', cls: '.btn.primary', html: '<button class="btn primary">Continue to checkout</button>', w: 1,
      use: 'The one main action of a view (add to cart, continue, pay). One per screen.' },
    { name: 'Primary, disabled', cls: '.btn.primary:disabled', html: '<button class="btn primary" disabled>Payment</button>', w: 1,
      use: 'Until the step is complete.' },
    { name: 'Secondary', cls: '.btn.outline', html: '<button class="btn outline">Continue shopping</button>', w: 1,
      use: 'The second action next to a primary. Dark green text.' },
    { name: 'Secondary, black', cls: '.btn.ghost', html: '<button class="btn ghost">No thanks</button>', w: 1,
      use: 'Same as Secondary with black text (cart delivery sheet). Merge with Secondary?', flag: true },
    { name: 'Pill', cls: '.pill', html: '<a class="pill" href="#">Read more</a>',
      use: 'Small actions and filters: Read more, chips, Shop X. Rounded, grey outline, black hover.' },
    { name: 'Pill, active', cls: '.pill.active', html: '<button class="pill active">All</button>',
      use: 'The chosen filter, or a dark green call to action in a block (Chat with us).' },
    { name: 'Edit', cls: '.btn-edit', html: '<button class="btn-edit">Edit</button>',
      use: 'Edit in a summary. Looks like a pill but 34px high: one of the two?', flag: true },
    { name: 'Round arrow', cls: '.d-rev-nav', html: `<button class="d-rev-nav" aria-label="Next">${ARROW}</button>`,
      use: 'Next/previous on rows that scroll (reviews, promo cards). 40px, white, grey outline, floats on the row edge.' },
    { name: 'Text link', cls: 'inline link', html: '<a href="#" style="color:#008539;text-decoration:underline;font-size:14px;line-height:22px">Shipping costs</a>',
      use: 'Links in running text, as the breadcrumbs: green and underlined.' },
  ];

  // ---------- Renderers per layout ----------
  const flag = it => it.flag || it.loose ? ' <span class="badge neutral">Check</span>' : '';
  const sw = it => `<div class="sw" style="background:${it.value || `var(${it.token})`}"></div>`;
  const val = it => it.value || tok(it.token);
  const codeOf = it => it.token ? `<code>${it.token}</code>` : '';
  const stageOne = b => `<div class="ds-stage">${b.w ? `<div class="w">${b.html}</div>` : b.html}</div>`;

  const R = {
    a: { // spec sheet
      colours: () => COLOURS.map(g => `<h3>${g.group}</h3>
        <div class="ds-stage"><div class="a-swatches">${g.items.map(it => `<div>${sw(it)}<small>${it.name}</small></div>`).join('')}</div></div>
        <table class="ds-table"><tr><th>Name</th><th>Token</th><th>Value</th><th>When to use</th></tr>
        ${g.items.map(it => `<tr><td><span class="dot" style="background:${val(it)}"></span>${it.name}</td><td>${codeOf(it) || '—'}</td><td>${val(it)}</td><td>${it.use}${flag(it)}</td></tr>`).join('')}</table>`).join(''),
      buttons: () => `<h3>All buttons</h3>
        <div class="ds-stage">${BUTTONS.map(b => b.w ? `<div class="w">${b.html}</div>` : b.html).join('')}</div>
        <table class="ds-table"><tr><th>Name</th><th>Class</th><th>When to use</th></tr>
        ${BUTTONS.map(b => `<tr><td>${b.name}</td><td><code>${b.cls}</code></td><td>${b.use}${flag(b)}</td></tr>`).join('')}</table>`,
    },
    b: { // side by side
      colours: () => COLOURS.map(g => `<h3>${g.group}</h3>${g.items.map(it => `
        <div class="b-row">${sw(it)}<div class="b-spec"><h5>${it.name}${flag(it)}</h5>
        <div class="meta">${codeOf(it)}<code>${val(it)}</code></div><p class="ds-note">${it.use}</p></div></div>`).join('')}`).join(''),
      buttons: () => `<h3>&nbsp;</h3>` + BUTTONS.map(b => `
        <div class="b-row">${stageOne(b)}<div class="b-spec"><h5>${b.name}${flag(b)}</h5>
        <div class="meta"><code>${b.cls}</code></div><p class="ds-note">${b.use}</p></div></div>`).join(''),
    },
    c: { // gallery
      colours: () => COLOURS.map(g => `<h3>${g.group}</h3><div class="c-grid">${g.items.map(it => `
        <div class="c-card">${sw(it)}<div class="c-body"><h5>${it.name}${flag(it)}</h5>
        <div class="meta">${codeOf(it)}<code>${val(it)}</code></div><p class="ds-note">${it.use}</p></div></div>`).join('')}</div>`).join(''),
      buttons: () => `<h3>&nbsp;</h3><div class="c-grid">` + BUTTONS.map(b => `
        <div class="c-card">${stageOne(b)}<div class="c-body"><h5>${b.name}${flag(b)}</h5>
        <div class="meta"><code>${b.cls}</code></div><p class="ds-note">${b.use}</p></div></div>`).join('') + '</div>',
    },
  };

  // ---------- Switches: layout A/B/C (left edge) + Mobile/Desktop (top), both in the URL ----------
  const q = new URLSearchParams(location.search);
  const L = ['a', 'b', 'c'].includes(q.get('l')) ? q.get('l') : 'b';
  const V = q.get('view') === 'm' ? 'm' : 'd';
  document.documentElement.classList.toggle('desk', V === 'd');
  const setQ = (k, v) => { const u = new URL(location.href); u.searchParams.set(k, v); location.href = u.toString(); };

  document.getElementById('dsMain').innerHTML = `
    <section class="ds-sec" id="colours"><h1>Colours</h1>
      <p class="ds-lead">Calm over loud: green for actions and the brand, orange only for commercial labels, greys for everything else. One line colour everywhere.</p>
      ${R[L].colours()}</section>
    <section class="ds-sec" id="buttons"><h1>Buttons &amp; pills</h1>
      <p class="ds-lead">Every button is a rounded pill. One primary action per view; secondary actions are white with a grey outline.</p>
      ${R[L].buttons()}</section>`;

  document.body.insertAdjacentHTML('beforeend', `<div class="desk-switch" role="group" aria-label="Sketch layouts"><span>Layout</span>${
    [['a', 'A', 'Spec sheet: one stage + table'], ['b', 'B', 'Side by side: example left, spec right'], ['c', 'C', 'Gallery: one card per item']]
      .map(([v, l, t]) => `<button data-l="${v}" aria-pressed="${v === L}" title="${t}">${l}</button>`).join('')}</div>`);
  document.querySelector('[data-l]').parentNode.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (b) setQ('l', b.dataset.l); });
  document.querySelectorAll('[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === V);
    b.addEventListener('click', () => setQ('view', b.dataset.view));
  });

  // Sidebar: current topic follows the scroll; drawer on mobile
  const links = [...document.querySelectorAll('.ds-side a:not(.soon)')], secs = [...document.querySelectorAll('.ds-sec')];
  const spy = () => { const cur = secs.filter(s => s.getBoundingClientRect().top < 120).pop() || secs[0];
    links.forEach(a => a.toggleAttribute('aria-current', a.hash === '#' + cur.id)); };
  addEventListener('scroll', spy, { passive: true }); spy();
  const side = document.getElementById('dsSide');
  document.getElementById('dsMenu').addEventListener('click', () => side.classList.toggle('open'));
  side.addEventListener('click', e => { if (e.target.closest('a')) side.classList.remove('open'); });
</script>
</body>
</html>
