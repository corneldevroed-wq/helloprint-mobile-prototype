<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Centre topic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,delivery_truck_speed,error,home,local_mall,receipt,upload&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261107m">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- Help Centre topic page (2026-10-29): help-topic.html?t=<topic>. Desktop: the 6 topics as a sidebar card left (the article
       page's two columns), right the topic head, sub-topic chips and per sub-topic the questions. Switch "Answers" (help-data.js):
       F = the answers fold open here (the category-page FAQ accordion; #<question> opens one), P = rows that open the article page.
       Mobile: the content first, the topics card below. Content from help-data.js. -->
  <main class="cat-page help-page">
    <section><p class="crumbs" id="ht-crumbs"></p></section>
    <section class="ha-grid">
      <aside class="ha-side" id="ht-side"></aside>
      <div class="ha-body" id="ht-body"></div>
    </section>

    <footer class="footer" data-shell="footer"></footer>
  </main>
</div>

<script src="app.js?v=20261107m"></script>
<script src="help-content.js?v=20261107m"></script>
<script src="help-data.js?v=20261107m"></script>
<script>
{ // own scope: app.js has globals like slug and sub
  const topic = HELP_TOPICS.find(t => t.id === new URLSearchParams(location.search).get('t') && t.id !== 'start') || HELP_TOPICS[1];   // Home lives on the hub
  document.title = topic.name + ' | Help Centre';
  document.getElementById('ht-crumbs').innerHTML = `<a href="index.html">Home</a> / <a href="help-centre.html">Help Centre</a> / ${topic.name}`;
  helpTopicView(document.getElementById('ht-side'), document.getElementById('ht-body'), topic);   // help-data.js

  helpSwitch();
}
</script>
</body>
</html>
