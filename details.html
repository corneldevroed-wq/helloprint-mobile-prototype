<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details &amp; Shipping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <div data-shell="checkout-header"></div>

  <!-- Details & shipping (Figma 15738:4488) -->
  <main class="co-page">
    <ol class="co-steps" aria-label="Checkout steps">
      <li class="done"><a href="cart.html">Cart</a></li>
      <li class="current" aria-current="step">Details</li>
      <li>Payment</li>
      <li>Confirmed</li>
    </ol>

    <form id="coForm" novalidate>
      <div class="co-extra">
        <div class="co-head"><h2>Contact details</h2><a href="#login">Login</a></div>
        <label class="field" data-field="email"><input type="email" name="email" placeholder=" " autocomplete="email" aria-label="Email address"><span class="fl">Email address</span></label>
        <label class="check"><input type="checkbox" id="isBusiness">I’m ordering for a business</label>
        <div class="co-extra" id="businessFields" hidden>
          <label class="field" data-field="company"><input name="company" placeholder=" " autocomplete="organization" aria-label="Company name"><span class="fl">Company name</span></label>
          <label class="field"><input name="vatnr" placeholder=" " aria-label="VAT number"><span class="fl">VAT number (optional)</span></label>
        </div>

        <div class="co-head"><h2>Delivery Address</h2></div>
        <div class="co-row">
          <label class="field" data-field="first"><input name="first" placeholder=" " autocomplete="given-name" aria-label="First name"><span class="fl">First name</span></label>
          <label class="field" data-field="last"><input name="last" placeholder=" " autocomplete="family-name" aria-label="Last name"><span class="fl">Last name</span></label>
        </div>
        <div class="co-row">
          <label class="field phone-prefix">
            <select name="prefix" aria-label="Country code">
              <option value="+353" selected>🇮🇪 +353</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+31">🇳🇱 +31</option>
              <option value="+32">🇧🇪 +32</option>
              <option value="+49">🇩🇪 +49</option>
              <option value="+33">🇫🇷 +33</option>
            </select>
          </label>
          <label class="field" data-field="phone"><input type="tel" name="phone" placeholder=" " autocomplete="tel-national" aria-label="Phone number"><span class="fl">Phone number</span></label>
        </div>
        <label class="field"><input name="country" value="Ireland" readonly aria-label="Country" placeholder=" " autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore tabindex="-1"><span class="fl">Country/Region</span></label>
        <label class="field" data-field="address1"><input name="address1" placeholder=" " autocomplete="address-line1" aria-label="Address line 1"><span class="fl">Address line 1</span></label>
        <label class="field"><input name="address2" placeholder=" " autocomplete="address-line2" aria-label="Address line 2"><span class="fl">Address line 2 (optional)</span></label>
        <div class="co-row">
          <label class="field" data-field="eircode"><input name="eircode" placeholder=" " autocomplete="postal-code" aria-label="Eircode" autocapitalize="characters"><span class="fl">Eircode</span></label>
          <label class="field" data-field="town"><input name="town" placeholder=" " autocomplete="address-level2" aria-label="Town or city"><span class="fl">Town / city</span></label>
        </div>
        <label class="check"><input type="checkbox" id="sameBilling" checked>Billing address is the same as delivery address</label>
        <div class="co-extra" id="billingFields" hidden>
          <label class="field" data-field="billAddress"><input name="billAddress" placeholder=" " autocomplete="billing address-line1" aria-label="Billing address line 1"><span class="fl">Billing address line 1</span></label>
          <div class="co-row">
            <label class="field" data-field="billEircode"><input name="billEircode" placeholder=" " autocomplete="billing postal-code" aria-label="Billing Eircode" autocapitalize="characters"><span class="fl">Eircode</span></label>
            <label class="field" data-field="billTown"><input name="billTown" placeholder=" " autocomplete="billing address-level2" aria-label="Billing town or city"><span class="fl">Town / city</span></label>
          </div>
        </div>

        <div class="co-head"><h2>Shipping method</h2></div>
        <div class="ship"><span class="radio"></span><span class="t"><b>Home delivery</b><small id="shipArrives"></small></span><span class="p">Included</span></div>
      </div>
    </form>
  </main>
</div>

<!-- Sticky bar (Figma 15738:4724) -->
<div class="cart-bar">
  <div class="sheet-bar">
    <div class="total"><strong id="barTotal"></strong><span class="bar-sub">Incl. VAT ·<img src="assets/pdp/check.svg" alt=""><span id="barArrives"></span></span></div>
    <button class="btn primary" id="toPayment" form="coForm" type="submit">Payment</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  // Nothing to check out → back to the cart
  const items = getCart();
  if (!items.length) location.replace('cart.html');
  document.body.classList.add('buybar-on');

  document.getElementById('barTotal').textContent = '€' + cartTotals().total.toFixed(2);
  if (items[0]) document.getElementById('barArrives').textContent = `arrives ${items[0].arrives}`;
  if (items[0]) document.getElementById('shipArrives').textContent = `${items[0].delivery} · arrives ${items[0].arrives}`;

  // Optional blocks
  const toggle = (box, id) => document.getElementById(box).toggleAttribute('hidden', !document.getElementById(id).checked);
  document.getElementById('isBusiness').addEventListener('change', () => toggle('businessFields', 'isBusiness'));
  document.getElementById('sameBilling').addEventListener('change', e => document.getElementById('billingFields').toggleAttribute('hidden', e.target.checked));

  // Remember what was typed (this browser only, localStorage) so testers don't have to retype it every time
  const form = document.getElementById('coForm'), KEY = 'hp-checkout-details';
  try {
    const saved = JSON.parse(localStorage.getItem(KEY)) || {};
    form.querySelectorAll('input, select').forEach(el => {
      if (!(el.name || el.id) || el.readOnly) return;
      const v = saved[el.name || el.id];
      if (v === undefined) return;
      if (el.type === 'checkbox') el.checked = v; else el.value = v;
    });
    document.getElementById('businessFields').toggleAttribute('hidden', !document.getElementById('isBusiness').checked);
    document.getElementById('billingFields').toggleAttribute('hidden', document.getElementById('sameBilling').checked);
  } catch (e) {}
  const remember = () => {
    const data = {};
    form.querySelectorAll('input, select').forEach(el => { if ((el.name || el.id) && !el.readOnly) data[el.name || el.id] = el.type === 'checkbox' ? el.checked : el.value; });
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  };
  form.addEventListener('input', remember);
  form.addEventListener('change', remember);

  // Validation: errors show after leaving a field and when going to Payment
  const EIRCODE = /^[A-Z]\d[\dW]\s?[A-Z\d]{4}$/i;
  const RULES = {
    email: [v => /^\S+@\S+\.\S+$/.test(v), 'Enter a valid email address'],
    company: [v => v.trim().length > 1, 'Enter your company name', () => document.getElementById('isBusiness').checked],
    first: [v => v.trim(), 'Enter your first name'],
    last: [v => v.trim(), 'Enter your last name'],
    phone: [v => v.replace(/\D/g, '').length >= 7, 'Enter a valid phone number'],
    address1: [v => v.trim().length > 2, 'Enter your address'],
    eircode: [v => EIRCODE.test(v.trim()), 'Enter a valid Eircode'],
    town: [v => v.trim(), 'Enter your town or city'],
    billAddress: [v => v.trim().length > 2, 'Enter your billing address', () => !document.getElementById('sameBilling').checked],
    billEircode: [v => EIRCODE.test(v.trim()), 'Enter a valid Eircode', () => !document.getElementById('sameBilling').checked],
    billTown: [v => v.trim(), 'Enter your town or city', () => !document.getElementById('sameBilling').checked],
  };
  function check(name) {
    const field = document.querySelector(`[data-field="${name}"]`), input = field.querySelector('input');
    const [ok, msg, applies] = RULES[name];
    const valid = (applies && !applies()) || !!ok(input.value);
    setFieldError(field, valid ? '' : msg);
    return valid;
  }
  Object.keys(RULES).forEach(name => {
    const input = document.querySelector(`[data-field="${name}"] input`);
    input.addEventListener('blur', () => { if (input.value || input.dataset.touched) check(name); input.dataset.touched = '1'; });
    input.addEventListener('input', () => { if (document.querySelector(`[data-field="${name}"]`).classList.contains('invalid')) check(name); });
  });
  document.querySelectorAll('[name=eircode], [name=billEircode]').forEach(i => i.addEventListener('blur', () => { i.value = i.value.toUpperCase(); }));

  document.getElementById('coForm').addEventListener('submit', e => {
    e.preventDefault();
    const bad = Object.keys(RULES).filter(n => !check(n));
    if (bad.length) {
      const first = document.querySelector(`[data-field="${bad[0]}"] input`);
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      first.focus({ preventScroll: true });
      showToast(bad.length === 1 ? '1 field needs your attention' : `${bad.length} fields need your attention`);
      return;
    }
    location.href = 'payment.html';
  });
</script>
</body>
</html>
