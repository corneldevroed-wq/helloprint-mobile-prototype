<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261121c">
<link rel="stylesheet" href="../design-system/components.css?v=20261121c">
<link rel="stylesheet" href="pages.css?v=20261121c">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="checkout-header"></div>

  <!-- Order confirmed (confirmed-combo-sketch.html, Cornel 2026-11-09): one layout for one or more order lines.
       1 the green strip (it worked) · 2 the actions: pay and/or upload, the most attention · 3 the products, always per order line ·
       4 order details with a map · 5 people, a proud line, Continue shopping. Desktop: the totals card on the right. -->
  <main class="co-page">
    <ol class="co-steps all-done" aria-label="Checkout steps">   <!-- every step done: a check on each (Cornel 2026-11-09) -->
      <li class="done">Cart</li>
      <li class="done">Details</li>
      <li class="done">Payment</li>
      <li class="current" aria-current="step">Confirmed</li>
    </ol>
    <div class="oc" id="oc"></div>
  </main>
  <footer data-shell="checkout-footer"></footer>
</div>
<!-- Upload your artwork: the PDP's popup (product.html #sheet-artwork), for one product of the order. The head says which product the files
     go to; no upsell, except the Premium Artwork Check while the order is still to be paid. Prototype: the files stay in this browser
     (name, size and a small picture), nothing is sent. -->
<div data-shell="sheet-art"></div>
<!-- All done: the standard popup (same overlay, ✕, Esc, swipe), filled by allDone() -->
<div class="sheet-layer" id="sheet-yay" aria-hidden="true">
  <!-- closes only with ✕ or the button (Cornel 2026-11-09): no click on the overlay, no swipe down -->
  <div class="sheet-overlay"></div>
  <div class="sheet oc-yay" role="dialog" aria-modal="true" aria-labelledby="yayTitle">
    <div class="grab"></div>   <!-- the space of the swipe handle, without the handle -->
    <div class="sheet-head"><span></span><button class="close" data-close-sheet aria-label="Close"><img src="assets/pdp/close.svg" alt=""></button></div>
    <div class="sheet-body"><div class="pad yay" id="yayBody"></div></div>
  </div>
</div>
<input type="file" id="artInput" multiple hidden>
<div class="sheet-layer" id="sheet-artwork" aria-hidden="true">
  <div class="sheet-overlay" data-close-sheet></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="artTitle">
    <div class="grab" data-grab><span></span></div>
    <div class="sheet-head">
      <h2 id="artTitle">Upload your artwork</h2>
      <button class="close" data-close-sheet aria-label="Close"><img src="assets/pdp/close.svg" alt=""></button>
    </div>
    <div class="sheet-body"><div class="pad" id="artBody"></div></div>
    <div class="sheet-bar">
      <div class="oc-for" id="artFor"></div>
      <button class="btn primary" id="artAdd" disabled>Add to my order</button>
    </div>
  </div>
</div>

<script src="app.js?v=20261121c"></script>
<script src="../design-system/components.js?v=20261121c"></script>
<script>
  // The order is kept by the payment page (this browser only); nothing here → back to the home page
  let order = null;
  try { order = JSON.parse(localStorage.getItem('hp-last-order')); } catch (e) {}
  const save = () => { try { localStorage.setItem('hp-last-order', JSON.stringify(order)); } catch (e) {} };

  function render() {
    const o = order, eur = n => '€' + n.toFixed(2), esc = t => String(t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const lines = o.items.map((it, i) => { const up = it.designType === 'upload' || /upload after checkout|upload later/i.test(it.design || '') || !!o.uploads[i]; return { ...it, i, up, needs: up && !o.uploads[i] }; });
    const todo = lines.filter(l => l.needs), toPay = o.when === 'later' && !o.paid;
    const first = l => l.reduce((a, b) => (etaDate(a.arrives) <= etaDate(b.arrives) ? a : b));   // the earliest date sets the deadline
    const many = lines.length > 1;
    const svg = '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24"/><path d="M14 25l7 7 13-15"/></svg>';

    // 1 · the green strip
    const done = !todo.length && !toPay;
    const strip = `<section class="oc-strip">${svg}<div><h1>Thank you${o.first ? ', ' + esc(o.first) : ''}!<br>${done ? 'Everything’s in.' : 'Your order is in.'}</h1>
      <p>${done ? 'We’ll take it from here. ' : ''}Order ${o.number}${o.email ? ` · confirmation sent to <b>${esc(o.email)}</b>` : ''}</p></div></section>`;

    // 2 · the actions: one upload per product that still needs a file (the PDP's drop field), then the payment
    const n = todo.length + (toPay ? 1 : 0);
    const logos = `<span class="pm-logos"><img src="assets/pay-visa.svg" alt="Visa"><img src="assets/pay-maestro.svg" alt="Maestro"><img src="assets/pay-mastercard.svg" alt="Mastercard">
      <span class="pm-brand apple"><img src="assets/checkout/applepay.png" alt="Apple Pay"></span><span class="pm-brand google"><img src="assets/checkout/google-g.svg" alt="">Pay</span>
      <span class="pm-brand paypal"><img src="assets/checkout/paypal-word.png" alt="PayPal"></span><span class="pm-brand"><img src="assets/checkout/revolut.png" alt="Revolut Pay"></span></span>`;
    // A block stays after its upload or payment and turns into "done" (Cornel 2026-11-09): the artwork replaces the product photo
    // and opens the artwork popup. Still to do: green outline + number; done: grey outline + a check
    const tick = '<span class="n"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg></span>';
    // Each upload block holds its order line as the cart shows it (Cornel 2026-11-09): photo (or the artwork, as the cart's tile:
    // opens the artwork popup), name, pieces · options, price, its own delivery date and its own deadline
    let k = 0;
    const lineOf = (l, files) => `<div class="line-item cart-line">${files
        ? `<button class="img art-tile" type="button" data-view-art="${l.i}" data-at="0" aria-label="View your artwork">${artPic(files[0])}${files.length > 1 ? `<span class="art-count">+${files.length - 1}</span>` : ''}</button>`
        : `<span class="img" style="background:var(--light-grey)"><img src="${l.img}" alt=""></span>`}
        <div class="t"><strong>${esc(l.name)}</strong><small>${l.qty.toLocaleString('en-IE')} ${l.qty === 1 ? 'pc' : 'pcs'}${l.options ? ' · ' + esc(l.options) : ''}</small></div><span class="p">${eur(l.price)}</span>
        <div class="eta">${etaHtml(l.arrives, '', l.delivery)}</div></div>`;
    // the check chosen for the order, named in the done band (Cornel 2026-11-09); the free one isn't named
    const paidCheck = { premium: 'Premium Artwork Check', deluxe: 'Deluxe Artwork Check' }[(o.addons || {}).check];
    const upAct = l => { const files = o.uploads[l.i];
      return files ? `<div class="oc-act done${l.i === justAdded ? ' oc-new' : ''}" id="up-${l.i}"><div class="row">${tick}<span class="t"><b>Upload successful</b></span>
          <span class="links"><button class="link" type="button" data-view-art="${l.i}" data-at="0">View</button><button class="link" type="button" data-up="${l.i}">Change</button></span></div>${lineOf(l, files)}
          <p class="oc-foot">${paidCheck ? `<b>${paidCheck}</b>` : 'File check'} in progress, proof coming soon</p></div>`
        : `<div class="oc-act" id="up-${l.i}"><div class="row"><span class="n">${++k}</span><span class="t"><b>Upload your design</b></span>
          <button class="btn primary" type="button" data-up="${l.i}"><img src="assets/pdp/d-upload.svg" alt="">Upload design</button></div>${lineOf(l)}
          <p class="oc-foot due">Upload by <b>10:30 on ${etaApprove(l.arrives)}</b> to keep this date</p></div>`; };
    const ups = lines.filter(l => l.up), todoActs = ups.filter(l => l.needs).map(upAct).join('');   // first: the uploads still to do are numbered before the payment
    const paid = o.when === 'later' && o.paid;
    const payAct = toPay ? `<div class="oc-act"><div class="row"><span class="n">${++k}</span>
          <span class="t"><b>Pay ${eur(o.total)}</b><small>Pay by 10:30 on ${etaApprove(first(lines).arrives)} · ${o.linkTo ? `we also emailed the link to ${esc(o.linkTo.name)}` : 'we also emailed you the link'}</small></span>
          <button class="btn primary" type="button" data-pay>Pay now</button></div>${logos}</div>`
      : paid ? `<div class="oc-act done"><div class="row">${tick}<span class="t"><b>Payment received</b><small>${eur(o.total)} · thank you</small></span></div></div>` : '';
    const actions = n || ups.length || paid ? `<section class="oc-sec"><h2>${n ? (n === 1 ? '1 thing' : n + ' things') + ' to start printing' : ups.length > 1 ? 'Your designs' : ups.length ? 'Your design' : 'Payment'}</h2>
      <p class="oc-lead">${[!n && 'We’ve got everything we need.', ups.length && 'We check every file for free and send you a proof.'].filter(Boolean).join(' ')}</p>
      <div class="oc-acts">${todoActs}${toPay ? payAct : ''}${ups.filter(l => !l.needs).map(upAct).join('')}${toPay ? '' : payAct}</div></section>` : '';   // what still needs to be done on top, then what's done

    // 3 · the products, always per order line: photo, specs, price, its own status and date
    const STEP = ['Check', 'Print', 'Ship', 'Delivered'];
    const lineHtml = l => {   // a card per order line; uploaded files show in the card they belong to
      const files = o.uploads[l.i];
      const now = l.needs ? `<b>Waiting for your design</b> · <a href="#up-${l.i}">Upload ↑</a>`
        : files ? '<b>We’re checking your file</b>'
        : l.designType === 'canva' ? '<b>We’re checking your design</b>' : '<b>We’re checking your file</b>';
      return `<div class="oc-line${l.i === justAdded ? ' oc-new' : ''}" id="line-${l.i}"><div class="top"><span class="img"><img src="${l.img}" alt=""></span>
        <div class="t"><b>${esc(l.name)}</b><small>${l.qty.toLocaleString('en-IE')} ${l.qty === 1 ? 'pc' : 'pcs'} · ${esc(l.delivery)}</small></div><b class="pr">${eur(l.price)}</b></div>
        <div class="bar">${STEP.map((s, k) => `<span class="${k ? '' : l.needs ? 'now' : 'on'}"></span>`).join('')}</div>   <!-- Check: light while it waits for the file, full green once we have it -->
        <div class="steps">${STEP.map((s, k) => `<span class="${k === 0 ? 'now' : ''}">${s}</span>`).join('')}</div>
        <div class="state"><span>${now}${toPay && !l.needs ? ' · then payment' : ''}</span><span class="date">Arrives ${etaShort(etaDate(l.arrives))}</span></div>
        ${files ? `<div class="oc-files"><b>Your design</b>${files.filter((f, k) => !k || f.name !== files[k - 1].name).map(f => { const pages = files.filter(x => x.name === f.name).length;
          return `<button class="up-file" type="button" data-view-art="${l.i}" data-at="${files.indexOf(f)}" aria-label="View your artwork">${f.thumb ? `<span class="up-thumb"><img src="${f.thumb}" alt=""></span>` : `<span class="up-ico">${esc(f.ext.toUpperCase().slice(0, 4))}</span>`}
          <span class="t"><b>${esc(f.name)}</b><small>${[f.size && sizeText(f.size), pages > 1 && pages + ' pages', 'added to this product ✓'].filter(Boolean).join(' · ')}</small></span><span class="link">View</span></button>`; }).join('')}</div>` : ''}</div>`;
    };
    // hidden (Cornel 2026-11-09): kept for My account later; on this page the blocks above show the uploads
    const products = `<section class="oc-sec" hidden><h2>Your product${many ? 's' : ''}</h2>${lines.map(lineHtml).join('')}</section>`;

    // 4 · order details with a map of the shipping address (Shopify)
    let det = {};
    try { det = JSON.parse(localStorage.getItem('hp-checkout-details')) || {}; } catch (e) {}
    const ship = [o.name, ...(o.addressLines || (o.address || '').split(', ')), 'Ireland'].filter(Boolean);
    const bill = det.sameBilling === false ? [[det.billFirst, det.billLast].filter(Boolean).join(' '), det.billAddress, det.billAddress2, [(det.billEircode || '').toUpperCase(), det.billTown].filter(Boolean).join(' ')].filter(Boolean) : ['Same as shipping address'];
    const card = /card/i.test(o.method || '') ? '<span class="pm-line"><img src="assets/pay-visa.svg" alt="Visa">•••• 4242</span>' : `<span>${esc(o.method)}</span>`;
    const pay = toPay ? `<span>Pay later</span><span>${eur(o.total)} to pay</span>` : `${o.paid ? '<span>Payment link</span>' : card}<span>${eur(o.total)} paid</span>`;
    const q = encodeURIComponent([det.address1 || (o.addressLines || [])[0], det.town || (o.addressLines || [])[1], det.eircode, 'Ireland'].filter(Boolean).join(', '));   // street, town, Eircode: Google puts a pin on a real Irish address
    const span = a => a.map(x => `<span>${esc(x)}</span>`).join('');
    const details = `<section class="oc-sec"><h2>Order details</h2><div class="oc-od">
      ${(o.addressLines || o.address) ? `<iframe title="Map of the shipping address" src="https://www.google.com/maps/embed?origin=mfe&amp;pb=!1m3!2m1!1s${q}!6i15"></iframe>` : ''}
      <div class="grid">
        <div><b>Contact</b>${span([o.name, o.email].filter(Boolean))}</div>
        <div><b>Payment</b>${pay}</div>
        <div><b>Shipping address</b>${span(ship)}</div>
        <div><b>Billing address</b>${span(bill)}</div>
        <div><b>Delivery</b>${span([[...new Set(lines.map(l => l.delivery))].join(', '), o.shipping ? eur(o.shipping) : 'Free'])}</div>
        <div><b>Order number</b><span>${o.number}</span></div>
      </div></div></section>`;

    // 5 · people, the way on
    const end = `<section class="oc-end"><div class="oc-team"><span class="faces"><img src="assets/help/team/saskia.webp" alt=""><img src="assets/help/team/timo.webp" alt=""><img src="assets/help/team/karen.webp" alt=""></span>
      <span>Any questions? Our team is ready to help. <a href="#chat">Start chat</a></span></div>
      <a class="btn outline" href="index.html">Continue shopping</a></section>`;

    document.getElementById('oc').innerHTML = strip + actions + products + details + end;
    // The last thing just got done (not on opening the page): the all-done moment
    if (wasDone === false && done) setTimeout(() => allDone(lines), 400);
    wasDone = done;
  }

  // Desktop: the totals card on the right (again when the Premium Artwork Check changes the order)
  function renderSide() {
    if (!DESK) return;
    document.querySelector('.co-page .cart-col')?.remove();
    document.querySelector('.co-page').insertAdjacentHTML('beforeend', `<div class="cart-col"><aside class="cart-side"><h2>Order overview</h2>${totalsHtml(order.items, order.addons || {})}</aside></div>`);
  }

  // Upload your artwork: the PDP's popup for one product (upFor); the files show with progress, then "We've got your file" (no confetti on repeat).
  // "Add to my order" puts them on that product: its card shows them, the action goes, the page scrolls to the card and it lights up once.
  const P = 'assets/pdp/', artInput = document.getElementById('artInput'), artBody = document.getElementById('artBody'), artAdd = document.getElementById('artAdd');
  let upFor = null, art = [], justAdded = null;
  const sizeText = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
  const fileThumb = f => f.progress === 100 && f.thumb ? `<span class="up-thumb"><img src="${f.thumb}" alt=""></span>` : `<span class="up-ico">${f.ext.toUpperCase().slice(0, 4)}</span>`;
  const artRow = (f, i) => `<div class="up-file${f.err ? ' err' : ''}">${fileThumb(f)}
      <div class="t"><b>${f.name.replace(/</g, '&lt;')}</b><small>${f.err ? `Didn’t upload: ${sizeText(f.size)}, max 200 MB` : [sizeText(f.size), f.progress === 100 && 'uploaded ✓'].filter(Boolean).join(' · ')}</small>
        ${f.err || f.progress === 100 ? '' : `<span class="up-bar"><i style="width:${f.progress}%"></i></span>`}</div>
      ${f.err || f.progress === 100 ? `<button class="up-replace" data-art-remove="${i}">Remove</button>` : ''}</div>`;
  const ART_PROMISE = `<div class="art-team"><span class="faces">${['saskia', 'timo', 'karen'].map(n => `<img src="assets/help/team/${n}.webp" alt="">`).join('')}</span><p><b>Any questions?</b>Our team is ready to help</p></div>`;
  // The only upsell here: the Premium Artwork Check, and only while the order is still to be paid (it changes the amount to pay)
  const toPay = () => order.when === 'later' && !order.paid;
  const artCheck = () => { const on = (order.addons || {}).check !== 'basic', t = CHECK_TIERS.find(x => x.id === (on ? order.addons.check : 'premium'));
    return `<div class="sum-up"><button class="switch" role="switch" aria-checked="${on}" data-art-check aria-label="Design check"></button><b>Add Premium Artwork Check</b><span class="p">€${t.price.toFixed(2)}</span><small>For extra peace of mind with your files.</small></div>`; };
  // The pictures of a file, as on the PDP (1200px, sharp in the artwork popup): an image as it is, a PDF one per page (max 10)
  const loadPdfJs = () => window.pdfjsLib ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  async function picsOf(file, ext) {
    try {
      const url = URL.createObjectURL(file), out = [];
      if (ext === 'pdf') {
        await loadPdfJs(); pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const doc = await pdfjsLib.getDocument(url).promise;
        for (let n = 1; n <= Math.min(doc.numPages, 10); n++) {
          const page = await doc.getPage(n), v = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 1200 / Math.max(v.width, v.height) });
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
          await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
          out.push(cv.toDataURL('image/jpeg', .85));
        }
        return out;
      }
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d'), k = Math.min(1, 1200 / Math.max(img.width, img.height));
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      return [cv.toDataURL('image/jpeg', .85)];
    } catch (e) { return []; }
  }
  function artFiles(list) {
    [...list].forEach(file => {
      const ext = (file.name.split('.').pop() || '').toLowerCase(), f = { name: file.name, size: file.size, ext, progress: 0, err: file.size > 200e6 };
      art.push(f);
      if (f.err) return;
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'pdf'].includes(ext)) picsOf(file, ext).then(p => { f.pics = p; f.thumb = p[0]; renderArt(); });
      const timer = setInterval(() => { f.progress = Math.min(100, f.progress + 20); renderArt(); if (f.progress === 100) clearInterval(timer); }, 180);
    });
    renderArt();
  }
  let artWasDone = false;
  function artConfetti() {
    const block = artBody.querySelector('.art-calm'); if (!block || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = block.getBoundingClientRect(), layer = document.createElement('div'), colours = ['--light-green', '--dark-green', '--orange', '--link'];
    layer.className = 'confetti'; Object.assign(layer.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    layer.innerHTML = Array.from({ length: 28 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:var(${colours[i % 4]});animation-delay:${Math.random() * .3}s;--x:${Math.random() * 60 - 30}px;--r:${Math.random() * 720 - 360}deg"></i>`).join('');
    document.body.appendChild(layer); setTimeout(() => layer.remove(), 1800);
  }
  function renderArt() {
    const it = order.items[upFor];
    document.getElementById('artFor').innerHTML = `<span class="img"><img src="${it.img}" alt=""></span><span><small>For</small><b>${it.name.replace(/</g, '&lt;')}</b></span>`;
    const busy = art.some(f => !f.err && f.progress < 100), done = art.length && !busy && !art.some(f => f.err);
    artAdd.disabled = !done;
    artAdd.textContent = busy ? 'Uploading…' : order.uploads[upFor] ? 'Update my order' : 'Add to my order';
    if (!art.length) {
      artBody.innerHTML = `<p class="up-intro">Upload your design for your <b>${it.name.replace(/</g, '&lt;')}</b>: one file or several, PDF works best.</p>
        <div class="art-drop"><img src="assets/desktop/upload-cloud.svg" alt=""><button class="btn outline" data-art-pick>Choose files</button><small>or drag them here · as many as you like</small></div>${ART_PROMISE}`;
      artWasDone = false;
      return;
    }
    artBody.innerHTML = `<div class="up-files">${art.map(artRow).join('')}</div><button class="up-add" data-art-pick>+ Add more files</button>
      ${!done ? ART_PROMISE : `<div class="art-calm"><b><img src="${P}check.svg" alt="">We’ve got your file${art.length > 1 ? 's' : ''}</b>
        <span>Add ${art.length > 1 ? 'them' : 'it'} to your order and we start checking.</span>
        <div class="up-check"><p class="ok"><img src="${P}check.svg" alt="">Every file gets our free automatic check</p><p class="ok"><img src="${P}check.svg" alt="">You’ll see a proof before we print</p></div>${toPay() ? artCheck() : ''}</div>`}`;
    if (done && !artWasDone) setTimeout(artConfetti);
    artWasDone = !!done;
  }
  sheetHooks.artwork = renderArt;
  document.addEventListener('click', e => {
    const jump = e.target.closest('a[href^="#up-"]');   // "Upload ↑": a smooth scroll to its action, which lights up once
    if (jump) {
      e.preventDefault();
      const act = document.querySelector(jump.getAttribute('href'));
      act.scrollIntoView({ behavior: 'smooth', block: 'center' });
      act.classList.remove('oc-new'); void act.offsetWidth; act.classList.add('oc-new');
    }
    const view = e.target.closest('[data-view-art]');
    if (view) openArt(order.uploads[+view.dataset.viewArt], +view.dataset.at);   // the cart's artwork popup
    const up = e.target.closest('[data-up]');
    if (up) {   // Change (as the PDP): the popup opens with the files already added, to remove, replace or add more
      upFor = +up.dataset.up;
      const had = order.uploads[upFor] || [];
      art = [...new Set(had.map(f => f.name))].map(name => { const pages = had.filter(f => f.name === name), { size, ext } = pages[0], pics = pages.map(f => f.thumb).filter(Boolean);
        return { name, size, ext, progress: 100, pics, thumb: pics[0] }; });
      artWasDone = art.length > 0;   // no confetti for files that were already in
      openSheet('artwork');
    }
    if (e.target.closest('[data-pay]')) {   // prototype: paying here = the payment link
      order.paid = true; save(); render();
      showToast('Payment received, thank you!');
    }
  });
  artInput.addEventListener('change', () => { artFiles(artInput.files); artInput.value = ''; });
  const artSheet = document.getElementById('sheet-artwork');
  artSheet.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-art-pick]')) artInput.click();
    if (t.closest('[data-art-remove]')) { art.splice(+t.closest('[data-art-remove]').dataset.artRemove, 1); renderArt(); }
    if (t.closest('[data-art-check]')) {   // the order changes: the check, and with it the totals and the amount to pay
      order.addons = { ...(order.addons || {}), check: order.addons?.check === 'basic' ? 'premium' : 'basic' };
      Object.assign(order, cartTotals(order.items, order.addons)); save(); renderArt(); render(); renderSide();
    }
  });
  artSheet.addEventListener('dragover', e => { e.preventDefault(); artSheet.querySelector('.art-drop')?.classList.add('over'); });
  artSheet.addEventListener('dragleave', e => { if (!artSheet.contains(e.relatedTarget)) artSheet.querySelector('.art-drop')?.classList.remove('over'); });
  artSheet.addEventListener('drop', e => { e.preventDefault(); artFiles(e.dataTransfer.files); });
  artAdd.addEventListener('click', () => {
    const name = order.items[upFor].name, changed = !!order.uploads[upFor];
    order.uploads[upFor] = art.filter(f => !f.err).flatMap(({ name, size, ext, pics = [] }) => pics.length
      ? pics.map((thumb, k) => ({ name, size, ext, thumb, page: pics.length > 1 ? `page ${k + 1} of ${pics.length}` : '' })) : [{ name, size, ext, thumb: null }]);
    save(); closeSheet(); justAdded = upFor; render();
    const card = document.getElementById('up-' + upFor);
    card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    showToast(changed ? `Your files for ${name} are updated` : `Added to your ${name}`);
    justAdded = null;
  });

  // All done (Cornel, 2026-11-09, "Tikkie style"): a happy popup with a big check that pops, confetti over the whole screen and one warm line
  let wasDone = null;
  function allDone(lines) {
    const ups = lines.filter(l => l.up);   // files can still be changed (Change in their block) until the earliest deadline
    const dates = [...new Set(lines.map(l => l.arrives))].sort((a, b) => etaDate(a) - etaDate(b)).map(d => etaShort(etaDate(d)));
    const when = dates.length > 1 ? `between <b>${dates[0]}</b> and <b>${dates.at(-1)}</b>` : `on <b>${dates[0]}</b>`;
    document.getElementById('yayBody').innerHTML = `<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="48"/><path d="M28 50l14 14 26-30"/></svg>
      <h2 id="yayTitle">All done${order.first ? ', ' + order.first.replace(/</g, '&lt;') : ''}!</h2>
      <p>We’ve got everything we need. Your print goes into production and arrives ${when}.</p>
      <button class="btn primary" type="button" data-close-sheet>Great, thanks!</button>
      ${ups.length ? `<small>Want to change a file? You can still upload a new one until <b>10:30 on ${etaApprove(ups.reduce((a, b) => (etaDate(a.arrives) <= etaDate(b.arrives) ? a : b)).arrives)}</b>.</small>` : ''}`;
    openSheet('yay');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = document.createElement('div'), colours = ['--light-green', '--dark-green', '--orange', '--link', '--white'];
    layer.className = 'confetti oc-yay-confetti';
    layer.innerHTML = Array.from({ length: 90 }, (_, k) => `<i style="left:${Math.random() * 100}%;background:var(${colours[k % 5]});animation-delay:${Math.random() * .6}s;--x:${Math.random() * 120 - 60}px;--r:${Math.random() * 720 - 360}deg"></i>`).join('');
    document.body.appendChild(layer); setTimeout(() => layer.remove(), 2600);
  }

  // Start: after everything above exists
  if (!order) location.replace('index.html');
  else {
    order.uploads = order.uploads || {};
    // Files uploaded on the PDP before checkout show in their own "Upload successful" block too, so they can still be viewed and changed
    order.items.forEach((it, i) => { if (!order.uploads[i] && (it.art || []).length) order.uploads[i] = it.art.map(({ name, size, ext, thumb, page }) => ({ name, size, ext, thumb, page })); });
    render();
    renderSide();   // desktop: the totals card on the right (the products are the cards on the left)
  }
</script>
</body>
</html>
