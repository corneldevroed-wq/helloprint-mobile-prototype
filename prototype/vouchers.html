<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vouchers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy,search&display=block" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261123mk">
<link rel="stylesheet" href="../design-system/components.css?v=20261123mk">
<link rel="stylesheet" href="pages.css?v=20261123mk">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- My account, Vouchers (V4, Cornel 2026-11-19, sketches/vouchers-sketch.html A: the list page of Orders, Invoices and Quotes): every personal
       discount code, what you get, valid until, its status and Copy while you can use it; a code from a complaint says so with a link to the case.
       Desktop a table (the rows open nothing, only Copy), mobile rows. Data: account.js (voucherList). -->
  <main class="account-page account-sub">
    <p class="crumbs"><a href="index.html">Home</a> / <a href="account.html">My account</a> / Vouchers</p>
    <div class="account-grid">
      <div data-account-side></div>
      <div class="account-main">
        <div><h1>Vouchers</h1><p class="oc-lead">Your personal discount codes. Add one in your cart under “Add discount code”.</p></div>
        <div class="filter-row" id="filters"></div>
        <div class="dash-card list-card"><label class="find"><span class="material-symbols-rounded" aria-hidden="true">search</span><input type="search" placeholder="Search a code or complaint" aria-label="Search vouchers"></label>
          <table class="dash-table list-table vc-list"><thead><tr><th>Code</th><th>What you get</th><th>Valid until</th><th>Status</th><th aria-label="Copy"></th></tr></thead><tbody id="rows-table"></tbody></table>
          <div class="list-rows" id="rows"></div>
          <p class="oc-lead" id="none" hidden>No vouchers match. Try another code.</p></div>
        <div class="dash-card" id="empty" hidden><p class="dash-empty">No vouchers yet. Personal discount codes, from us or after a complaint, show up here.</p></div>
      </div>
    </div>
  </main>
  <footer class="footer" data-shell="footer"></footer>
</div>
<script src="app.js?v=20261123mk"></script>
<script src="account.js?v=20261123mk"></script>
<script src="../design-system/components.js?v=20261123mk"></script>
<script>
{ // its own scope: no clash with app.js names
  if (!deskUser) location.replace('login.html');
  document.querySelector('[data-account-side]').outerHTML = accountSide('vouchers.html');

  // Filters as on Orders, Invoices and Quotes: All · Available, then Used and Expired only when there are any; the search (code, complaint, what you get)
  const all = voucherList();
  const GROUPS = [['all', 'All', () => true], ['ok', 'Available', v => v.st === 'ok'], ['used', 'Used', v => v.st === 'used'], ['expired', 'Expired', v => v.st === 'expired']].filter(([, , f], n) => n < 2 || all.some(f));
  let group = 'all', q = '';
  const from = v => { const c = v.complaint && complaintOf(v.complaint); return c ? `From complaint <a class="link" href="complaint.html?c=${c.no}">${c.no}</a> · ${c.issue.toLowerCase()}` : ''; };   // the extra line (V4)
  const when = v => v.used ? `Used ${v.used[0]} on <a class="link" href="order.html?o=${v.used[1]}">order #${v.used[1]}</a>` : `${v.st === 'expired' ? 'Expired' : 'Valid until'} ${v.until}`;
  const copy = v => `<button type="button" class="icon-btn" data-copy="${v.code}" data-tip="Copy code" aria-label="Copy ${v.code}"><span class="material-symbols-rounded" aria-hidden="true">content_copy</span></button>`;
  const status = v => `<span class="status ${v.status[0]}">${v.status[1]}</span>`;
  function render() {
    document.getElementById('filters').innerHTML = GROUPS.map(([k, label, f]) => `<button class="pill${k === group ? ' active' : ''}" type="button" aria-pressed="${k === group}" data-g="${k}">${label}<small>${all.filter(f).length}</small></button>`).join('');
    const f = GROUPS.find(g => g[0] === group)[2], hit = v => !q || [v.code, v.val, v.what, v.complaint].join(' ').toLowerCase().includes(q);
    const list = all.filter(v => f(v) && hit(v));
    document.getElementById('rows-table').innerHTML = list.map(v => `<tr><td><span class="first"><span><b>${v.code}</b>${from(v) ? `<small>${from(v)}</small>` : ''}</span></span></td>
      <td><b>${v.val}</b><br>${v.what}</td><td>${when(v)}</td><td>${status(v)}</td><td>${v.st === 'ok' ? copy(v) : ''}</td></tr>`).join('');
    // mobile: the table's content as rows: value · code, what for · until, the complaint line; Copy while you can use it, else the status
    document.getElementById('rows').innerHTML = list.map(v => `<div class="dash-row text"><span class="t"><b>${v.val} · ${v.code}</b><small>${v.what} · ${when(v)}</small>${from(v) ? `<small>${from(v)}</small>` : ''}</span>${v.st === 'ok' ? copy(v) : status(v)}</div>`).join('');
    document.querySelectorAll('.list-table, .list-rows').forEach(el => el.hidden = !list.length);   // nothing found: the line in the card, under the search
    document.getElementById('none').hidden = !!list.length || !all.length;
    if (!all.length) { document.getElementById('filters').hidden = true; document.querySelector('.list-card').hidden = true; document.getElementById('empty').hidden = false; }   // a new customer
  }
  document.getElementById('filters').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; group = b.dataset.g; render(); });
  document.querySelector('.find input').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
  document.addEventListener('click', e => { const c = e.target.closest('[data-copy]'); if (!c) return;
    navigator.clipboard?.writeText(c.dataset.copy).catch(() => {}); showToast(`${c.dataset.copy} copied: add it in your cart under “Add discount code”`); });
  render();
}
</script>
</body>
</html>
