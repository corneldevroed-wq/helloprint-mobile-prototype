<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a problem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=photo_camera,send,upload,videocam&display=block" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261205zx">
<link rel="stylesheet" href="../design-system/components.css?v=20261205zx">
<link rel="stylesheet" href="pages.css?v=20261205zx">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- My account, Report a problem (report.html?o=<order>; Cornel 2026-11-18, sketches/report-sketch.html A, a page of its own without the account card):
       the wishes artifact's form, each question showing once the one before is answered: which order (the 10-day window), which products, the area, what
       happened, how many (only for problems with the products), a sentence, the photos asked per problem, what we should do, the need-by date with the
       reprint check. Send creates the case (CMP-1043…) and opens it. Back: to the order you came from, or Complaints. Data: account.js (REPORT_AREAS). -->
  <main class="account-page account-sub">
    <p class="crumbs"><a href="index.html">Home</a> / <a href="account.html">My account</a> / <a href="complaints.html">Complaints</a> / Report a problem</p>
    <div class="report-main" id="report"></div>
  </main>
  <footer class="footer" data-shell="footer"></footer>
</div>
<script src="app.js?v=20261205zx"></script>
<script src="account.js?v=20261205zx"></script>
<script src="upload.js?v=20261205zx"></script>
<script src="../design-system/components.js?v=20261205zx"></script>
<script>
{ // its own scope: no clash with app.js names
  if (!deskUser) location.replace('login.html');
  const from = new URLSearchParams(location.search).get('o'), back = from ? [`order.html?o=${from}`, `Back to order #${from}`] : ['complaints.html', 'Back to Complaints'];
  const esc = t => String(t).replace(/[&<"]/g, c => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;' })[c]), ms = n => `<span class="material-symbols-rounded" aria-hidden="true">${n}</span>`;
  const TODAY = new Date('2026-11-18T12:00:00');   // the prototype's today
  const day = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const addWorkDays = (d, n) => { const x = new Date(d); while (n) { x.setDate(x.getDate() + 1); if (x.getDay() % 6) n--; } return x; };
  // the orders you can report on: shipped or delivered; their 10-day window runs from delivery
  const orders = ORDERS.filter(o => o.step >= 3 && !o.cancelled);
  const st = { order: orders.some(o => o.no === from) ? from : '', products: [], area: '', prob: '', qty: '', more: '', ev: {}, fix: '', need: '' };

  function render() {
    const o = orderOf(st.order), prob = st.area && st.prob !== '' ? REPORT_AREAS[st.area][st.prob] : null, fix = REPORT_FIXES[st.fix];
    const delivered = o && o.step === 4, until = o && addDays(etaDate(o.lines[0].arrives), 10), closed = delivered && until < TODAY;
    const left = delivered && Math.ceil((until - TODAY) / 864e5), warn = delivered && left <= 3, areas = delivered ? Object.keys(REPORT_AREAS) : ['Delivery'];   // V4 (11-19): 3 days or fewer = a warning; not delivered yet = delivery problems only
    const q = (h, body, hint = '') => `<section class="rp-q"><h2>${h}</h2>${hint ? `<p>${hint}</p>` : ''}${body}</section>`;
    const parts = [];
    // Which order? (V4, Cornel 2026-11-19, sketch 11B): a search; focus shows your latest orders, typing searches all of them (the header search's dropdown);
    // "Another order, or can't find it?" at the end goes to chat
    parts.push(q('Which order?', `<div class="rp-find"><label class="field"><input type="search" data-k="find" placeholder=" " autocomplete="off" value="${o ? esc(`#${o.no} · ${o.name}`) : ''}" aria-label="Search your orders"><span class="fl">Search order number, product or your reference</span></label>
      <div class="sd-drop" id="findDrop" hidden></div></div>
      ${st.other ? `<div class="oc-foot rp-band"><b>Can’t find your order?</b> Our team finds it with you and takes your report from there. <a class="link" href="#chat">Chat with Anna</a></div>` : ''}
      ${!o ? '' : closed ? `<div class="oc-foot rp-band"><b>This order was delivered more than 10 days ago</b> (${o.lines[0].arrives}), so it can’t be reported through this form. Our team can still look at it with you. <a class="link" href="#chat">Chat with an agent</a></div>`
        : `<div class="oc-foot rp-band">${warn ? `<b>Only ${left} day${left > 1 ? 's' : ''} left.</b> ` : ''}You can report a problem until <b>${delivered ? day(until) : '10 days after delivery'}</b>${delivered ? '' : ` (expected ${o.lines[0].arrives})`}<br>Add the photos we ask for and we solve it fastest.</div>
        <details class="spec-fold"><summary class="link">Why 10 days?</summary><table class="fold-table"><tbody><tr><td>Within 10 days</td><td>the printer or the carrier still accept a claim, so we solve it fast and in full</td></tr><tr><td>After 10 days</td><td>no longer through this form, but our team can still look at it with you in chat</td></tr></tbody></table></details>`}`));
    if (!o || closed) return finish(parts);
    if (o.lines.length > 1) parts.push(q('Which products?', `<div class="rp-checks">${o.lines.map((l, i) => `<label class="check"><input type="checkbox" data-p="${i}"${st.products.includes(i) ? ' checked' : ''}>${esc(l.name)} · ${l.spec.split(' · ')[0]}</label>`).join('')}</div>`));
    if (o.lines.length > 1 && !st.products.length) return finish(parts);
    if (!delivered) st.area = 'Delivery';
    parts.push(q('What is the problem about?', `<div class="rp-pills">${areas.map(a => `<button class="pill${a === st.area ? ' active' : ''}" type="button" aria-pressed="${a === st.area}" data-area="${a}">${a}</button>`).join('')}</div>
      ${!delivered ? `<p class="pd-note">Not delivered yet, so you can only report a delivery problem now.</p>` : `<details class="spec-fold"><summary class="link">Not sure which one to pick?</summary><table class="fold-table"><tbody><tr><td>Artwork / design</td><td>the file itself, or how it printed vs. your design</td></tr><tr><td>Product / print quality</td><td>the physical result: colour, cut or finish</td></tr><tr><td>Packaging</td><td>damaged or wrong packaging</td></tr><tr><td>Delivery</td><td>late, missing, or the wrong address</td></tr></tbody></table></details>`}`));
    if (!st.area) return finish(parts);
    parts.push(q('What exactly happened?', `<label class="field"><select data-k="prob" aria-label="What happened"><option value="">Choose what happened</option>${REPORT_AREAS[st.area].map((p, i) => `<option value="${i}"${String(i) === String(st.prob) ? ' selected' : ''}>${p.t}</option>`).join('')}</select></label>`));
    if (!prob) return finish(parts);
    if (prob.item) parts.push(q('How many are affected?', `<div class="rp-pills">${[['all', 'All of them'], ['most', 'Most of them'], ['few', 'A handful']].map(([k, t]) => `<button class="pill${k === st.qty ? ' active' : ''}" type="button" aria-pressed="${k === st.qty}" data-qty="${k}">${t}</button>`).join('')}</div>
      <label class="field"><input type="number" min="1" placeholder=" " data-k="exact" value="${st.exact || ''}" aria-label="The exact number"><span class="fl">The exact number, if you know it</span></label>`));
    if (prob.item && !st.qty) return finish(parts);
    parts.push(q('Tell us a bit more', `<label class="field"><textarea placeholder=" " data-k="more" maxlength="600" aria-label="Tell us a bit more">${esc(st.more)}</textarea><span class="fl">A sentence or two helps us fix it faster (optional)</span></label>`));
    parts.push(q('Add these photos', `<div class="dash-card rp-ev">${prob.evidence.map((t, i) => { const f = st.ev[i], vid = /screenshot/i.test(t);
        return `<div class="dash-row text"><span class="t"><b>${ms(vid ? 'videocam' : 'photo_camera')}${t}</b><small>${f ? `<span class="ok">✓ ${esc(f)}</span>` : 'Not added yet'}</small></span><button class="btn small ${f ? 'outline' : 'primary'}" type="button" data-ev="${i}">${f ? 'Change' : `${ms('upload')}Upload`}</button></div>`; }).join('')}</div>`,
      'Exactly what we need to sort it in one go. JPG, PNG or MP4, up to 10 MB each.'));
    if (prob.evidence.some((_, i) => !st.ev[i])) return finish(parts);
    parts.push(q('What would you like us to do?', `<ul class="addr-list">${prob.sol.map(k => `<li class="${k === st.fix ? 'on' : ''}"><button type="button" class="ap-pick" aria-pressed="${k === st.fix}" data-fix="${k}"><span class="radio" aria-hidden="true"></span><span class="t"><b>${REPORT_FIXES[k].t}</b><span>${REPORT_FIXES[k].s}</span></span></button></li>`).join('')}</ul>`));
    if (!fix) return finish(parts);
    if (fix.reprint) { const earliest = addWorkDays(TODAY, 4), need = st.need && new Date(st.need + 'T23:00:00');
      parts.push(q('When do you need it by, at the latest?', `<label class="field rp-date"><input type="date" data-k="need" min="2026-11-19" value="${st.need}" placeholder=" " aria-label="Need it by"><span class="fl">Need it by</span></label>
        ${!need ? '' : need >= earliest ? `<div class="oc-foot rp-band rp-ok"><b>Good news: a reprint can still make it.</b> The earliest we can reprint and deliver is <b>${day(earliest)}</b>, you need it by <b>${day(need)}</b>. Send it and we get it moving straight away.</div>`
          : `<div class="oc-foot rp-band"><b>A standard reprint won’t arrive in time.</b> The earliest we can deliver is <b>${day(earliest)}</b>, you need it by <b>${day(need)}</b>. Let’s find the fastest way together. <a class="link" href="#chat">Chat with Anna about faster options</a></div>`}`,
        'We check it against the print calendar straight away.'));
      if (!need) return finish(parts); }
    finish(parts, true);
  }
  function finish(parts, ready) {
    document.getElementById('report').innerHTML = `<a class="ha-back" href="${back[0]}">${back[1]}</a><div><h1>Report a problem</h1><p class="oc-lead">Tell us what went wrong and we make it right. Your case shows up in Complaints.</p></div>
      <div class="dash-card"><div class="rp">${parts.join('')}${ready ? `<div class="rp-foot"><small>Prefer to talk it through? <a class="link" href="#chat">Chat with Anna</a></small><button class="btn primary" type="button" data-send>${ms('send')}Send to our team</button></div>` : ''}</div></div>
      ${teamLine('Not sure what to choose? Our team is ready to help.')}`;
  }
  const findDrop = q => { const d = document.getElementById('findDrop'), w = q.trim().toLowerCase();
    const hits = w ? orders.filter(o => [o.no, o.name, o.ref, ...o.lines.map(l => l.name)].join(' ').toLowerCase().includes(w)) : orders.slice(0, 4);
    d.innerHTML = `<div class="sd-prods"><p class="sd-label">${w ? `Orders<span>${hits.length} found</span>` : 'Your latest orders'}</p><div class="s-products">${hits.length ? hits.map(o => `<button type="button" class="s-prod" data-pick="${o.no}">${orderPhoto(o)}<span class="info"><strong>${esc(orderTitle(o))}</strong><small>${o.step === 4 ? 'Delivered' : 'Arriving'} ${o.lines[0].arrives}${o.ref ? ' · ' + esc(o.ref) : ''}</small></span></button>`).join('')
      : '<p class="sd-none">No order matches. Try its number or your reference.</p>'}</div></div><button type="button" class="sd-all" data-other>Another order, or can’t find it?</button>`;
    d.hidden = false; };
  // answers: a choice draws the next question; typing only keeps the text
  const box = document.getElementById('report');
  box.addEventListener('change', e => { const k = e.target.dataset.k, p = e.target.dataset.p;
    if (k === 'prob') Object.assign(st, { prob: e.target.value, qty: '', ev: {}, fix: '', need: '' });
    if (k === 'need') st.need = e.target.value;
    if (p !== undefined) st.products = [...box.querySelectorAll('[data-p]:checked')].map(x => +x.dataset.p);
    if (k === 'prob' || k === 'need' || p !== undefined) render(); });
  box.addEventListener('input', e => { const k = e.target.dataset.k; if (k === 'more' || k === 'exact') st[k] = e.target.value; if (k === 'find') findDrop(e.target.value); });
  box.addEventListener('focusin', e => { if (e.target.dataset.k === 'find') { e.target.select(); findDrop(''); } });
  document.addEventListener('click', e => { const d = document.getElementById('findDrop'); if (!d || d.hidden) return;   // a choice, or a click outside closes it
    const pk = e.target.closest('[data-pick]'), other = e.target.closest('[data-other]');
    if (pk) Object.assign(st, { order: pk.dataset.pick, other: false, products: [], area: '', prob: '', qty: '', ev: {}, fix: '', need: '' });
    if (other) Object.assign(st, { order: '', other: true });
    if (pk || other) render(); else if (!e.target.closest('.rp-find')) d.hidden = true; });
  box.addEventListener('click', e => { const t = e.target.closest('[data-area], [data-qty], [data-fix], [data-ev], [data-send]'); if (!t) return;
    if (t.dataset.area) { Object.assign(st, { area: t.dataset.area, prob: '', qty: '', ev: {}, fix: '', need: '' }); render(); }
    if (t.dataset.qty) { st.qty = t.dataset.qty; render(); }
    if (t.dataset.fix) { st.fix = t.dataset.fix; render(); }
    if (t.dataset.ev !== undefined) { const i = +t.dataset.ev, o = orderOf(st.order), prob = REPORT_AREAS[st.area][st.prob];   // the upload popup, one per photo we ask for
      openUpload({ photo: true, name: prob.evidence[i], img: 'assets/' + o.lines[st.products[0] || 0].img, onAdd: files => { st.ev[i] = files[0]?.name || 'photo.jpg'; st.files = [...(st.files || []).filter(f => f.ev !== i), ...files.map(f => ({ ...f, ev: i }))]; render(); } }); }
    if (t.dataset.send !== undefined) { const o = orderOf(st.order), prob = REPORT_AREAS[st.area][st.prob], lines = (o.lines.length > 1 ? st.products : [0]).map(i => o.lines[i]);
      const no = complaintCreate({ order: o.no, ref: o.ref, issue: prob.t, area: st.area, fix: REPORT_FIXES[st.fix].t, need: st.need, photos: st.files || [],
        about: `You reported this on Wed 18 Nov${st.qty ? `: ${{ all: 'all of them are', most: 'most of them are', few: 'a handful are' }[st.qty]} affected${st.exact ? ` (${st.exact})` : ''}` : ''}.${st.more ? ' ' + st.more : ''}`,
        lines: lines.map(l => ({ img: l.img, name: l.name, spec: l.spec, gross: l.gross })) });
      toastOnNextPage(`Thanks! Case ${no} is with our team, we reply by email within one working day`); location.href = complaintUrl(no); }
  });
  render();
}
</script>
</body>
</html>
