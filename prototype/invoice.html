<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=download&display=block" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261205p">
<link rel="stylesheet" href="../design-system/components.css?v=20261205p">
<link rel="stylesheet" href="pages.css?v=20261205p">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- My account, one invoice or credit note (invoice.html?i=<number>; Cornel 2026-11-17: as close to the order page as possible, the wishes
       artifact's content): the pay block while it is open, what is on it (the products as the order page shows them), Invoice details as
       Order details (without the map), the team line and the questions. Right: the invoice overview (the order's totals, then payments and
       credits, what is still to pay, Download invoice) and Need something?. Data: account.js (invoiceList). -->
  <main class="account-page account-sub">
    <p class="crumbs"><a href="index.html">Home</a> / <a href="account.html">My account</a> / <a href="invoices.html">Invoices</a> / <span id="crumb"></span></p>
    <div class="account-grid">
      <div data-account-side></div>
      <div class="account-main" id="invoice"></div>
    </div>
  </main>
  <footer class="footer" data-shell="footer"></footer>
</div>
<script src="app.js?v=20261205p"></script>
<script src="account.js?v=20261205p"></script>
<script src="../design-system/components.js?v=20261205p"></script>
<script>
{ // its own scope: no clash with app.js names
  if (!deskUser) location.replace('login.html');
  if (!invoiceList().length) location.replace('invoices.html');   // a new customer (the Demo switch): no invoices yet
  document.querySelector('[data-account-side]').outerHTML = accountSide('invoices.html');
  const NO = new URLSearchParams(location.search).get('i') || invoiceList()[0].no;
  const esc = t => String(t).replace(/[&<"]/g, c => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;' })[c]);
  const actRow = ([act, icon, title, sub, o, what]) => `<button type="button" data-act="${act}" data-o="${o}"${what ? ` data-what="${what}"` : ''}><span class="ico"><img src="../design-system/icons/${icon}.svg" alt=""></span><span><b>${title}</b><small>${sub}</small></span></button>`;
  const linkRow = ([href, icon, title, sub]) => dropRow([href, icon, title, sub]).replace(' role="menuitem"', '');

  const row = ([t, s]) => `<div><span>${t}</span><span>${s}</span></div>`;
  function render() {
    const inv = invoiceOf(NO) || invoiceList()[0], o = inv.o, cr = !!inv.credit, kind = cr ? 'Credit note' : 'Invoice', e = accEur, open = inv.open > .005;
    document.title = `${kind} ${inv.no}`;
    document.getElementById('crumb').textContent = inv.no;

    // where it stands: the pay block while open (Pay now = the order's payment link); paid or the credit's state as a done block
    const lastPay = !cr && inv.pays.at(-1);
    const block = open ? `<div class="oc-act" id="line-pay"><div class="row"><span class="t"><b>Pay ${e(inv.open)}</b><small>Due ${inv.due} · we also emailed you the link</small></span>
      <span class="btns"><button class="btn small primary" type="button" data-act="pay" data-o="${o.no}">Pay now</button></span></div></div>`
      : `<div class="oc-act done" id="line-pay"><div class="row">${DONE_TICK}<span class="t"><b>${cr ? inv.state : `Paid ${lastPay.date}`}</b><small>${cr
        ? (inv.state === 'Refunded' ? `Refunded ${inv.refund.date} · ${inv.refund.method}` : inv.state === 'Applied' ? 'Fully applied to your invoices' : 'Available to use on your next invoice')
        : `${e(inv.total)} · ${lastPay.method}`}</small></span>${!cr && /visa/i.test(lastPay.method) ? '<span class="pm-logos"><img src="assets/pay-visa.svg" alt="Visa"></span>' : ''}</div></div>`;   // paid by card: the card's logo on the right, as order confirmed's Payment received

    // Invoice details (the artifact's document head, as Order details without the map): number, issued, due, terms, order, your reference, the addresses
    const forInv = cr && invoiceOf(inv.credit);
    const details = `<section class="oc-sec"><h2>${kind} details</h2><div class="oc-od"><div class="grid">
        <div><b>${kind}</b><span>${inv.no}</span></div>
        <div><b>Issued</b><span>${inv.date}</span></div>
        ${cr ? `<div><b>Status</b><span>${inv.state}</span></div><div><b>Issued for</b><span><a class="link" href="${invoiceUrl(inv.credit)}">${inv.credit}</a></span></div>`
          : `<div><b>Due</b><span>${open ? (inv.due === 'on receipt' ? 'On receipt' : inv.due) : 'Paid'}</span></div><div><b>Terms</b><span>${invTerms(o.x.method)}</span></div>`}
        <div><b>Order</b><span><a class="link" href="order.html?o=${o.no}">#${o.no}</a></span></div>
        <div><b>Your reference</b><span>${o.ref ? esc(o.ref) : '—'}</span></div>
        <div><b>Billed to</b>${addrLines(o.bill).map(t => `<span>${esc(t)}</span>`).join('')}</div>
        ${cr ? '' : `<div><b>Shipped to</b>${addrLines(o.ship).map(t => `<span>${esc(t)}</span>`).join('')}</div>`}
      </div></div></section>`;

    // Items: every row with its net, VAT % and VAT and the total incl. VAT (Cornel: per item); then the totals. Mobile: net and VAT under the description
    const items = `<section class="oc-sec"><h2>Items</h2><div class="dash-card"><table class="items-table"><thead><tr><th>Description</th><th class="vat-col">Net</th><th class="vat-col">VAT %</th><th class="vat-col">VAT</th><th>Total</th></tr></thead><tbody>
      ${inv.rows.map(r => { const v = vatSplit(r.gross); return `<tr><td><b>${esc(r.name)}</b>${r.spec ? `<small>${esc(r.spec)}</small>` : ''}<small class="nv">Net ${e(v.net)} · VAT 23% ${e(v.vat)}</small></td>
        <td class="vat-col">${e(v.net)}</td><td class="vat-col">23%</td><td class="vat-col">${e(v.vat)}</td><td>${e(v.gross)}</td></tr>`; }).join('')}</tbody></table>
      <div class="totals"><div><span>Subtotal <small>(Excl. VAT)</small></span><span>${e(inv.sum.net)}</span></div><div><span>VAT 23%</span><span>${e(inv.sum.vat)}</span></div>
        <div class="grand"><span>Total <small>(Incl. VAT)</small></span><span>${e(inv.sum.gross)}</span></div></div></div></section>
      ${teamLine()}
      <section class="oc-sec"><h2>Questions about this ${cr ? 'credit note' : 'invoice'}</h2><ul class="hc-rows">${(cr
        ? [['Where can I find my credit invoice?', 'where-can-i-find-my-credit-invoice'], ['Downloading invoices & credit notes', 'how-do-i-download-my-invoices-and-credit-notes']]
        : [...(open ? [['How do I pay on invoice?', 'how-do-i-pay-on-invoice'], ['Why did I receive a payment reminder?', 'why-did-i-receive-a-payment-reminder']] : []),
          ['How can I change my billing address?', 'how-can-i-change-my-invoice-address'], ['Downloading invoices & credit notes', 'how-do-i-download-my-invoices-and-credit-notes']])
        .map(([q, slug]) => `<li><a href="help-article.html?q=${slug}"><span>${q}</span><img class="chev" src="assets/category/arrow.svg" alt=""></a></li>`).join('')}</ul></section>`;

    // Payments and credits (the artifact's pay card): the total, the credit notes applied, the payments with date and method, what is still to pay.
    // A credit note: its total, where it is applied or refunded, the credit left
    const used = cr ? r2((inv.apps || []).reduce((s, a) => s + a.amt, 0)) : 0;
    const payments = cr ? `<div class="totals"><div><span>Credit note total</span><span>${e(inv.total)}</span></div>
        ${(inv.apps || []).map(a => row([`Applied to <a class="link" href="${invoiceUrl(a.inv)}">${a.inv}</a><br><small>${a.date}</small>`, e(a.amt)])).join('')}
        ${inv.refund ? row([`Refunded<br><small>${inv.refund.date} · ${inv.refund.method}</small>`, e(-inv.total)]) : ''}
        <div class="grand"><span>Credit left</span><span>${e(inv.refund ? 0 : r2(-inv.total - used))}</span></div></div>`
      : `<div class="totals"><div><span>Invoice total</span><span>${e(inv.total)}</span></div>
        ${inv.credits.map(c => row([`Credit note <a class="link" href="${invoiceUrl(c.cn)}">${c.cn}</a><br><small>${c.date}</small>`, e(-c.amt)])).join('')}
        ${inv.pays.map(p => row([`Payment received<br><small>${p.date} · ${p.method}</small>`, e(-p.amt)])).join('')}
        <div class="grand"><span>Still to pay</span><span>${e(Math.max(0, inv.open))}</span></div></div>`;
    // Related: the order and the credit notes (or the invoices a credit note is for)
    const related = (cr ? [...new Set([inv.credit, ...(inv.apps || []).map(a => a.inv)])].map(n => linkRow([invoiceUrl(n), 'receipt-long', `Invoice ${n}`, (inv.apps || []).some(a => a.inv === n) ? `${e(inv.apps.find(a => a.inv === n).amt)} applied` : 'Credit issued for this invoice']))
      : [linkRow([`order.html?o=${o.no}`, 'package-2', `Order #${o.no}`, `Placed ${o.placed}${o.ref ? ' · ' + esc(o.ref) : ''}`]),
        ...inv.notes.map(n => { const c = invoiceOf(n); return linkRow([invoiceUrl(n), 'receipt-long', `Credit note ${n}`, `${e(c.total)} · ${c.state}`]); })]).join('');
    const need = [...(open ? [['paylink', 'mail', 'Resend payment link', `To ${o.payer ? o.payer.email : deskUser?.email || 'your email'}`, o.no], ['payer', 'person', 'Change who pays', 'Send the link to a colleague', o.no]] : []),
      ['soon', 'receipt-long', 'Something wrong on it?', 'We correct it and send a new one', o.no, 'Correcting an invoice']].map(actRow).join('') + linkRow(['#chat', 'support-agent', 'Chat with Anna', 'The fastest way to sort it']);
    const side = `<div class="od-side"><div class="dash-card"><h2>Payments and credits</h2>${payments}<div class="dash-foot od-inv">
        <button class="btn outline small" type="button" data-act="invoice" data-o="${o.no}" data-doc="${kind} ${inv.no}"><span class="material-symbols-rounded" aria-hidden="true">download</span>Download PDF</button></div></div>
      <div class="dash-card"><h2>Related</h2><div class="d-menu d-head account-nav">${related}</div></div>
      <div class="dash-card"><h2>Need something?</h2><div class="d-menu d-head account-nav">${need}</div></div></div>`;

    document.getElementById('invoice').innerHTML = `<div class="od-head"><h1>${kind} ${inv.no}</h1><p class="oc-lead"><span class="status ${inv.status[0]}">${inv.status[1]}</span> · issued ${inv.date} · ${esc(o.name)} · order #${o.no}</p></div>
      <div class="od-grid"><div class="od-lines">${block}${details}${items}</div>${side}</div>`;
  }
  render();
  window.addEventListener('hp-orders', render);   // paid, a colleague pays: draw again
}
</script>
</body>
</html>
