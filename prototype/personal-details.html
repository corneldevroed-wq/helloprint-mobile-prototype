<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=campaign,domain,lock,mail,sms&display=block" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261203z">
<link rel="stylesheet" href="../design-system/components.css?v=20261203z">
<link rel="stylesheet" href="pages.css?v=20261203z">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- My account, Personal details (Cornel 2026-11-18, sketches/personal-sketch.html A, password in Profile, an icon per setting): the wishes artifact's
       content as a settings list. A card per section (Profile, Communication preferences, Company info, E-invoicing), every setting a row: icon, what
       it is now, one small button (Edit, Add, Change, Set up) that opens the standard popup with just those fields; the switches work right away.
       Prototype data only: kept in this browser ('hp-profile', the name and email also in 'hp-user'); a password is never stored. -->
  <main class="account-page account-sub">
    <p class="crumbs"><a href="index.html">Home</a> / <a href="account.html">My account</a> / Personal details</p>
    <div class="account-grid">
      <div data-account-side></div>
      <div class="account-main" id="pd"></div>
    </div>
  </main>
  <footer class="footer" data-shell="footer"></footer>
</div>
<script src="app.js?v=20261203z"></script>
<script src="account.js?v=20261203z"></script>
<script src="../design-system/components.js?v=20261203z"></script>
<script>
{ // its own scope: no clash with app.js names
  if (!deskUser) location.replace('login.html');
  document.querySelector('[data-account-side]').outerHTML = accountSide('personal-details.html');
  const esc = t => String(t).replace(/[&<"]/g, c => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;' })[c]);
  const ms = n => `<span class="material-symbols-rounded" aria-hidden="true">${n}</span>`;
  const COUNTRIES = { Ireland: 'ie', 'United Kingdom': 'gb', Netherlands: 'nl', Belgium: 'be', Germany: 'de', France: 'fr', Italy: 'it' };   // the round flags of the country menu
  const load = () => { try { return JSON.parse(localStorage.getItem('hp-profile')) || {}; } catch (e) { return {}; } };
  const P = { first: deskUser?.first || '', last: deskUser?.last || '', email: deskUser?.email || '', phone: '', company: 'Merrion Studio', vat: '', invMail: '',
    marketing: true, sms: false, pw: 'never', einv: {}, ...load() };
  function save(msg) {
    try { localStorage.setItem('hp-profile', JSON.stringify(P)); localStorage.setItem('hp-user', JSON.stringify({ ...deskUser, first: P.first, last: P.last, email: P.email })); } catch (e) {}
    Object.assign(deskUser, { first: P.first, last: P.last, email: P.email });   // the account card shows the new name straight away
    document.querySelector('.account-side').outerHTML = accountSide('personal-details.html');
    render(); if (msg) showToast(msg);
  }

  // a setting: icon, title, what it is now (grey; "Not set" when empty), the action
  const notSet = '<span class="not-set">Not set</span>';
  const kv = rows => `<div class="spec-fold-rows">${rows.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('')}</div>`;   // several values in one setting: label grey, value black (the order page's specifications; Cornel 2026-11-18)
  const row = (ico, t, s, end, extra = '') => `<div class="dash-row text has-ico">${ico.endsWith('.svg') ? `<span class="hc-ico"><img src="../design-system/icons/${ico}" alt=""></span>` : `<span class="hc-ico material-symbols-rounded" aria-hidden="true">${ico}</span>`}<span class="t"><b>${t}</b>${s.startsWith('<div class="spec-fold-rows">') ? s : `<small>${s}</small>`}</span>${end}${extra}</div>`;
  const btn = (k, t) => `<button class="btn small outline" type="button" data-edit="${k}">${t}</button>`;
  const sw = (k, on, label) => `<button class="switch" role="switch" type="button" data-sw="${k}" aria-checked="${on}" aria-label="${label}"></button>`;
  const sec = (h, body, after = '') => `<section class="oc-sec"><h2>${h}</h2><div class="dash-card">${body}</div>${after}</section>`;

  // texts on: the mobile number right under it (Cornel 2026-11-18), the checkout's country code + number; saved as you leave the field
  const PREFIXES = [['+353', '🇮🇪'], ['+44', '🇬🇧'], ['+31', '🇳🇱'], ['+32', '🇧🇪'], ['+49', '🇩🇪'], ['+33', '🇫🇷'], ['+39', '🇮🇹']];
  const splitPhone = () => { const m = (P.phone || '').match(/^(\+\d+)\s*(.*)$/); return m ? [m[1], m[2]] : ['+353', P.phone || '']; };
  const smsField = () => { const [pre, no] = splitPhone();
    return `<div class="pd-sms"><div class="co-row"><label class="field phone-prefix"><select name="smsPrefix" aria-label="Country code">${PREFIXES.map(([c, f]) => `<option value="${c}"${c === pre ? ' selected' : ''}>${f} ${c}</option>`).join('')}</select></label>
      <label class="field"><input type="tel" name="smsNo" placeholder=" " value="${esc(no)}" autocomplete="tel-national" aria-label="Mobile number"><span class="fl">Mobile number</span></label></div>
      <p class="pd-note">Saved automatically. We only text order updates, never marketing.</p></div>`; };
  function render() {
    document.getElementById('pd').innerHTML = `<div><h1>Personal details</h1><p class="oc-lead">Who you are, what you hear from us and how you’re invoiced.</p></div>`
      + sec('Profile', row('account-grey.svg', 'Name and phone', kv([['Name', esc(`${P.first} ${P.last}`.trim()) || notSet], ['Phone', P.phone ? esc(P.phone) : notSet]]), btn('details', 'Edit'))   // one button = one popup (Cornel 2026-11-18)
        + row('mail', 'Email', `${esc(P.email)}<br>Where we send order updates and sign-in codes`, btn('email', 'Edit'))
        + row('lock', 'Password', `Last changed: ${P.pw}`, btn('password', 'Change')))
      + sec('Communication preferences', row('campaign', 'Marketing emails', 'Newsletter, offers and product news. Order emails always come, whatever you choose.', sw('marketing', P.marketing, 'Marketing emails'))
        + row('sms', 'Order updates by text', P.sms ? 'We text you when your order ships. You’ll always get the same updates by email too.' : 'Get a text when your order ships, as well as the email.', sw('sms', P.sms, 'Order updates by text'), P.sms ? smsField() : ''))
      + sec('Company info', row('domain', 'Company', kv([['Name', P.company ? esc(P.company) : notSet], ['VAT number', P.vat ? esc(P.vat) : notSet], ['Invoices to', esc(P.invMail || P.email)]]), btn('company', P.company || P.vat ? 'Edit' : 'Add')),
        `<p class="pd-note">Used on your invoices and shipping labels. An address can have its own in <a class="link" href="#addresses">Addresses</a>.</p>`)
      + sec('E-invoicing', Object.entries(COUNTRIES).map(([c, f]) => `<div class="dash-row text has-ico"><span class="hc-ico"><img class="round" src="assets/flags/${f}.svg" alt=""></span><span class="t"><b>${c}</b><small>${P.einv[c] ? esc(P.einv[c]) : 'Not set up'}</small></span>${btn('einv:' + c, P.einv[c] ? 'Change' : 'Set up')}</div>`).join(''),
        `<p class="pd-note">Invoices sent straight into your bookkeeping, per country you order for.</p>`);
  }
  render();

  // the popup: one standard sheet, filled per setting (just those fields), Save checks and keeps it
  document.body.insertAdjacentHTML('beforeend', accSheet('pd', '', '', '<button class="btn outline" type="button" data-close-sheet>Cancel</button><button class="btn primary" type="button" data-pd-save>Save</button>'));
  const field = (name, label, value = '', type = 'text', auto = '') => `<label class="field"><input name="${name}" type="${type}" placeholder=" " value="${esc(value)}" aria-label="${label}"${auto ? ` autocomplete="${auto}"` : ''}><span class="fl">${label}</span></label>`;
  const isEmail = v => /^\S+@\S+\.\S+$/.test(v);
  const EDITS = {
    // name and phone together (Cornel 2026-11-18: things you fill in at once share one popup); email and password each their own (sign-in, a check)
    details: ['Your details', () => `<div class="auth-row">${field('first', 'First name', P.first, 'text', 'given-name')}${field('last', 'Last name', P.last, 'text', 'family-name')}</div>
        ${field('phone', 'Phone number (optional)', P.phone || '+353 ', 'tel', 'tel')}<p class="pd-note">Only to text you about your orders (if you want) and when our team needs to reach you about one.</p>`,
      v => { const ph = v.phone.replace(/\D/g, '').length > 3 ? v.phone : '';
        if (!v.first || !v.last || (ph && ph.replace(/\D/g, '').length < 9)) return { ...(!v.first && { first: 'Enter your first name' }), ...(!v.last && { last: 'Enter your last name' }), ...(ph && ph.replace(/\D/g, '').length < 9 && { phone: 'Enter your phone number with the country code' }) };
        P.first = v.first; P.last = v.last; P.phone = ph; return 'Your details are saved'; }],
    email: ['Your email', () => `<p class="up-intro">Order updates, invoices and your sign-in codes go here.</p>${field('email', 'Email address', P.email, 'email', 'email')}`,
      v => isEmail(v.email) ? (P.email = v.email, 'Your email is saved') : { email: 'Enter a valid email address' }],
    password: ['Change your password', () => `${field('cur', 'Current password', '', 'password', 'current-password')}${field('pw', 'New password', '', 'password', 'new-password')}<p class="pd-note">At least 8 characters.</p>`,
      v => !v.cur ? { cur: 'Enter your current password' } : v.pw.length < 8 ? { pw: 'Use at least 8 characters' } : (P.pw = 'Wed 18 Nov', 'Your password is changed')],
    // the company: the three fields of your invoices in one popup
    company: ['Company info', () => `<p class="up-intro">On your invoices and shipping labels. An address can have its own in Addresses.</p>${field('company', 'Company name', P.company, 'text', 'organization')}
        ${field('vat', 'VAT number (optional)', P.vat || 'IE')}${field('invMail', 'Invoice email (optional)', P.invMail, 'email')}<p class="pd-note">Empty: your invoices go to your own email.</p>`,
      v => { const vat = v.vat.toUpperCase() === 'IE' ? '' : v.vat.toUpperCase().replace(/\s/g, '');
        const err = { ...(vat && !/^[A-Z]{2}[\dA-Z]{7,12}$/.test(vat) && { vat: 'Enter a VAT number like IE1234567X' }), ...(v.invMail && !isEmail(v.invMail) && { invMail: 'Enter a valid email address' }) };
        if (Object.keys(err).length) return err;
        P.company = v.company; P.vat = vat; P.invMail = v.invMail; return 'Your company info is saved'; }],
  };
  const einv = c => [`E-invoicing · ${c}`, () => `<p class="up-intro">Your invoices for ${c} go straight into your bookkeeping through Peppol, the European network for e-invoices.</p>${field('peppol', 'Your Peppol ID', (P.einv[c] || '').replace(/^Peppol · /, ''))}<p class="pd-note">Your bookkeeping software shows it, for example 0190:IE1234567X.</p>`,
    v => !v.peppol ? (delete P.einv[c], `E-invoicing for ${c} is off`) : /^\d{4}:\S{4,}$/.test(v.peppol) ? (P.einv[c] = `Peppol · ${v.peppol}`, `E-invoicing for ${c} is set up`) : { peppol: 'Enter it as scheme:number, for example 0190:IE1234567X' }];
  let cur = null;
  const box = document.getElementById('sheet-pd');
  document.addEventListener('click', e => {
    const ed = e.target.closest('[data-edit]');
    if (ed) { const k = ed.dataset.edit; cur = k.startsWith('einv:') ? einv(k.slice(5)) : EDITS[k];
      document.getElementById('pdTitle').textContent = cur[0]; document.getElementById('pdBody').innerHTML = `<div class="pd-form">${cur[1]()}</div>`;
      openSheet('pd'); setTimeout(() => box.querySelector('input')?.focus(), 300); return; }
    const s = e.target.closest('[data-sw]');
    if (s) { const k = s.dataset.sw; P[k] = !P[k];
      save(k === 'marketing' ? (P[k] ? 'You’ll get our newsletter and offers' : 'No more marketing emails. Order emails still come') : (P[k] ? (P.phone ? 'We’ll text you when your order ships' : '') : 'No more texts about your orders'));
      if (k === 'sms' && P.sms && !splitPhone()[1]) document.querySelector('[name="smsNo"]').focus();   // no number yet: straight into the field
      return; }
    if (e.target.closest('[data-pd-save]')) {
      const v = Object.fromEntries([...box.querySelectorAll('input')].map(i => [i.name, i.value.trim()]));
      const r = cur[2](v);
      box.querySelectorAll('.field').forEach(f => setFieldError(f, typeof r === 'object' ? r[f.querySelector('input').name] : ''));
      if (typeof r === 'object') { box.querySelector('.field.invalid input')?.focus(); return; }
      closeSheet(); save(r);
    }
  });
  document.getElementById('pd').addEventListener('change', e => {   // the mobile number: kept as you leave the field or change the country code
    if (!e.target.closest('.pd-sms')) return;
    const w = e.target.closest('.pd-sms'), no = w.querySelector('[name="smsNo"]').value.trim(), f = w.querySelector('[name="smsNo"]').closest('.field');
    if (no && no.replace(/\D/g, '').length < 7) { setFieldError(f, 'Enter your mobile number'); return; }
    setFieldError(f, ''); P.phone = no ? `${w.querySelector('[name="smsPrefix"]').value} ${no}` : ''; save(no ? 'Your mobile number is saved' : '');
  });
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) box.querySelector('[data-pd-save]').click(); });
}
</script>
</body>
</html>
