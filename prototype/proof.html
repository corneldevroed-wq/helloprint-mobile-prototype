<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,chevron_left,chevron_right,download,open_in_new,remove&display=block" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261205zza">
<link rel="stylesheet" href="../design-system/components.css?v=20261205zza">
<link rel="stylesheet" href="pages.css?v=20261205zza">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- My account, a proof (proof.html?o=<order>&l=<product>; Cornel 2026-11-17, sketches/proof-sketch.html B): a page of its own, so a reminder
       email or a colleague can open it (not logged in: the login page brings you back here). The proof is always a PDF: a PDF viewer (pdf.js).
       Under it what we did with the file, Leave a note (a popup), our team. Approve and Upload new design fixed at the bottom, as the PDP's bars. -->
  <main class="account-page account-sub proof-page">
    <p class="crumbs"><a href="index.html">Home</a> / <a href="account.html">My account</a> / <a href="orders.html">Orders</a> / <a id="crumbOrder" href="orders.html"></a> / Proof</p>
    <div class="account-grid">
      <div data-account-side></div>
      <div class="account-main" id="proof"></div>
    </div>
  </main>
  <footer class="footer" data-shell="footer"></footer>
</div>
<div data-shell="sheet-art"></div>
<script src="app.js?v=20261205zza"></script>
<script src="account.js?v=20261205zza"></script>
<script src="upload.js?v=20261205zza"></script>
<script src="../design-system/components.js?v=20261205zza"></script>
<script>
{ // its own scope: no clash with app.js names
  if (!deskUser) location.replace('login.html');   // the login page brings you back here (from a reminder email)
  if (!ORDERS.length) location.replace('orders.html');   // a new customer (the Demo switch): no orders yet
  window.yayLater = true;   // all done after Approve or a new file: the popup on the order page
  document.querySelector('[data-account-side]').outerHTML = accountSide('orders.html');
  const q = new URLSearchParams(location.search), o = orderOf(q.get('o')) || ORDERS[0], li = +(q.get('l') || 0), l = o.lines[li] || o.lines[0];
  const order = `order.html?o=${o.no}`, PDF = `assets/proofs/${l.proof || 'business-cards'}.pdf`, waiting = l.step === 1 && l.btns && !o.cancelled;
  document.title = `Your proof · ${l.name}`;
  Object.assign(document.getElementById('crumbOrder'), { href: order, textContent: `Order #${o.no}` });
  const check = PROOFS[l.proof] || PROOFS['business-cards'];
  const pb = (ic, tip, attrs = '') => `<${attrs ? 'a' : 'button type="button"'} class="pdf-btn" ${attrs} title="${tip}" aria-label="${tip}"><span class="material-symbols-rounded" aria-hidden="true">${ic}</span></${attrs ? 'a' : 'button'}>`;   // the browser's PDF viewer: a white icon, no circle
  // More proofs in this order (Cornel 2026-11-17: do them in one go): a tab per product with a proof, its state under the name;
  // Approve or a new file goes on to the next proof that still waits, the last one back to the order
  const proofs = o.lines.map((p, i) => ({ p, i })).filter(({ p }) => p.proof), waits = p => p.step === 1 && p.btns && !o.cancelled;
  const next = proofs.find(({ p, i }) => i !== li && waits(p)), goNext = () => location.href = next ? proofUrl(o, next.i) : order;
  const TABS = proofs.length > 1 ? `<nav class="tabs proof-tabs" aria-label="The proofs in this order">${proofs.map(({ p, i }) => `<a href="${proofUrl(o, i)}"${i === li ? ' class="active" aria-current="page"' : ''}>${p.name}<small>${waits(p) ? 'To approve' : p.title}</small></a>`).join('')}</nav>` : '';
  const ACTS = `<button class="btn primary" type="button" data-proof="approve">Approve proof</button><button class="btn outline" type="button" data-proof="upload">Upload new design</button>`;

  document.getElementById('proof').innerHTML = `<div><a class="ha-back" href="${order}">Back to order #${o.no}</a><h1>Your proof: ${l.name}</h1><p class="oc-lead">Order #${o.no} · ${l.spec}</p></div>
    ${TABS}
    ${waiting && l.foot ? `<p class="oc-foot proof-band">${l.foot}</p>` : !waiting ? `<p class="oc-foot proof-band">${o.cancelled ? 'This order is cancelled.' : `${l.title}. <a class="link" href="${order}">Back to your order</a>`}</p>` : ''}
    <div class="pdf-viewer"><div class="bar">
        <span class="group pages"><span data-p="-1">${pb('chevron_left', 'Previous page')}</span><span class="box" id="pdfPages">1 / 1</span><span data-p="1">${pb('chevron_right', 'Next page')}</span></span>
        <span class="group"><span data-z="-1">${pb('remove', 'Zoom out')}</span><span class="box" id="pdfZoom">100%</span><span data-z="1">${pb('add', 'Zoom in')}</span></span>
        <span class="end">${pb('open_in_new', 'Open the PDF in a new tab', `href="${PDF}" target="_blank"`)}${pb('download', 'Download the proof (PDF)', `href="${PDF}" download`)}</span></div>
      <div class="stage" id="pdfStage"><canvas id="pdfCanvas" aria-label="Your proof, page 1"></canvas></div></div>
    <div class="dash-card file-check"><ul aria-label="What we did with your file">${check.map(([st, t, s]) => `<li>${st === 'ok' ? '<img src="assets/pdp/check.svg" alt="">' : '<span class="dot" aria-hidden="true"></span>'}<b>${t}</b><small>${s}</small></li>`).join('')}</ul></div>
    ${waiting ? `<div class="proof-acts" id="proofActs">${ACTS}</div>` : ''}
    ${teamLine('Not sure? Our team checks it with you.')}`;

  // Approve, Upload new design and Leave a note fixed at the bottom while the ones in the page are out of view, as the PDP's bars:
  // desktop the white bar (the product, the deadline), mobile the sticky bar with the note as its link row
  if (waiting) {
    const btns = `<button class="btn outline" type="button" data-proof="upload">Upload new design</button><button class="btn primary" type="button" data-proof="approve">Approve proof</button>`;
    document.body.insertAdjacentHTML('beforeend', DESK
      ? `<div class="d-bar" id="proofBar" aria-hidden="true"><div class="dwrap"><span class="d-bar-prod"><span class="thumb"><img src="assets/proofs/${l.proof || 'business-cards'}.png" alt=""></span><span class="t"><b>${l.name}</b><span class="d-bar-sub">${l.foot ? l.foot.replace(/ to keep.*/, '').replace(/\.<\/b> Approve today.*/, '</b>') : 'Your proof is ready'}</span></span></span><span class="bar-btns">${btns}</span></div></div>`
      : `<div class="buy-bar" id="proofBar" aria-hidden="true"><div class="sheet-bar"><div class="bar-btns">${btns}</div></div></div>`);
    const bar = document.getElementById('proofBar'), acts = document.getElementById('proofActs');
    const toggle = show => { bar.classList.toggle('show', show); bar.setAttribute('aria-hidden', String(!show)); };
    toggle(acts.getBoundingClientRect().top > innerHeight);   // on load: the page's buttons are below the screen
    new IntersectionObserver(([e]) => toggle(!e.isIntersecting && e.boundingClientRect.top > 0)).observe(acts);   // then: shown while they are further down
  }
  // Approve asks first (V4, Cornel 2026-11-19, sketch 10A): we print exactly this, one tick makes Yes work; the note for the artwork team goes with it
  // (it replaces the separate "Leave a note" link and popup)
  document.body.insertAdjacentHTML('beforeend', accSheet('approve', 'Approve this proof?', `<p class="up-intro">We print your ${l.name} exactly as in the proof. After this, the design can’t change any more.</p>
    <label class="check"><input type="checkbox" id="approveOk">I’ve checked the text, spelling, colours and size</label>
    <label class="field"><textarea id="approveNote" placeholder=" " maxlength="600" aria-label="A note for our artwork team"></textarea><span class="fl">A note for our artwork team (optional)</span></label>`,
    '<button class="btn outline" type="button" data-close-sheet>Back to the proof</button><button class="btn primary" type="button" data-proof="yes" disabled>Yes, approve</button>'));
  const ok = document.getElementById('approveOk'), note = document.getElementById('approveNote'), yes = document.querySelector('[data-proof="yes"]');
  ok.addEventListener('change', () => yes.disabled = !ok.checked);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-proof]'); if (!b) return;
    if (b.dataset.proof === 'approve') { ok.checked = false; yes.disabled = true; note.value = ''; openSheet('approve'); }   // first the confirm (V4, sketch 10A)
    if (b.dataset.proof === 'yes') { flashLine(o.no, li); orderSave(o.no, d => d.lines[li] = 'approved');
      toastOnNextPage(`Proof approved: we print your ${l.name} next${note.value.trim() ? ', with your note to our artwork team' : ''}${next ? `. One more: ${next.p.name}` : ''}`); goNext(); }
    if (b.dataset.proof === 'upload') openUpload({ name: l.name, img: 'assets/' + l.img,
      onAdd: files => { flashLine(o.no, li); orderSave(o.no, d => d.lines[li] = files); toastOnNextPage(`Added to your ${l.name}: we check it and send you a new proof`); goNext(); } });
  });

  // The PDF (pdf.js, as the upload popup): fit to the viewer, zoom in steps of 25%
  let pdfDoc = null, pdfPage = null, pageNo = 1, zoom = 1;
  const draw = async () => {
    pdfPage = await pdfDoc.getPage(pageNo);
    document.getElementById('pdfPages').textContent = `${pageNo} / ${pdfDoc.numPages}`;
    document.querySelectorAll('[data-p]').forEach(p => { p.hidden = pdfDoc.numPages === 1;   // one page: no arrows
      p.querySelector('.pdf-btn').disabled = p.dataset.p < 0 ? pageNo === 1 : pageNo === pdfDoc.numPages; });
    const stage = document.getElementById('pdfStage'), cv = document.getElementById('pdfCanvas'), v1 = pdfPage.getViewport({ scale: 1 });
    const fit = Math.min((stage.clientWidth - 32) / v1.width, (stage.clientHeight - 32) / v1.height), vp = pdfPage.getViewport({ scale: fit * zoom * devicePixelRatio });
    cv.width = vp.width; cv.height = vp.height; cv.style.width = vp.width / devicePixelRatio + 'px'; cv.style.height = vp.height / devicePixelRatio + 'px';
    await pdfPage.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    document.getElementById('pdfZoom').textContent = Math.round(zoom * 100) + '%';   // 100% = the page fits
  };
  upPdfJs().then(async () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfDoc = await pdfjsLib.getDocument(new URL(PDF, location.href).href).promise; await draw(); }).catch(() => {   // the PDF did not load (e.g. a page opened from disk): the proof as a picture, the PDF still to open
    document.getElementById('pdfCanvas').outerHTML = `<img class="pdf-page" src="assets/proofs/${l.proof || 'business-cards'}.png" alt="Your proof">`; document.getElementById('pdfZoom').textContent = '100%'; document.querySelectorAll('[data-p]').forEach(p => p.hidden = true); });   // page 1 only: no arrows
  document.addEventListener('click', e => { if (!pdfDoc) return;   // zoom in steps of 25% from Fit; the pages one by one (a business card: front and back)
    const z = e.target.closest('[data-z]'), pg = e.target.closest('[data-p]');
    if (z) { zoom = Math.max(1, Math.min(4, zoom + +z.dataset.z * .25)); draw(); }
    if (pg) { const n = pageNo + +pg.dataset.p; if (n >= 1 && n <= pdfDoc.numPages) { pageNo = n; draw(); } } });
}
</script>
</body>
</html>
