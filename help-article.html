<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Centre article</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,delivery_truck_speed,error,home,local_mall,receipt,thumb_down,thumb_up,upload&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261106m">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- Help Centre article page (2026-10-29): help-article.html?q=<question slug>. Desktop: left the topics menu
       (the topics menu of the Help Centre home, the article's topic marked), right the full article.
       Mobile: the article first, the sidebar card below it. Content from help-data.js (shared with the hub). -->
  <main class="cat-page help-page">
    <section><p class="crumbs" id="ha-crumbs"></p></section>
    <section class="ha-grid">
      <aside class="ha-side" id="ha-side"></aside>
      <article class="ha-body">
        <a class="ha-back" id="ha-back" href="help-centre.html">Back</a>
        <h1 id="ha-title"></h1>
        <div class="ha-text" id="ha-text"></div>
        <div class="ha-helpful">
          <span>Was this article helpful?</span>
          <span class="btns">
            <button class="pill" type="button" aria-label="Yes" data-helpful><span class="material-symbols-rounded" aria-hidden="true">thumb_up</span></button>
            <button class="pill" type="button" aria-label="No" data-helpful><span class="material-symbols-rounded" aria-hidden="true">thumb_down</span></button>
          </span>
        </div>
      </article>
    </section>

    <footer class="footer" data-shell="footer"></footer>
  </main>
</div>

<script src="app.js?v=20261106m"></script>
<script src="help-content.js?v=20261106m"></script>
<script src="help-data.js?v=20261106m"></script>
<script>
{ // own scope: app.js has globals like slug and sub
  const qSlug = new URLSearchParams(location.search).get('q') || 'can-i-change-my-order';
  const hit = helpFind(qSlug) || helpFind('can-i-change-my-order');
  const { q, topic } = hit;
  document.title = q + ' | Help Centre';

  document.getElementById('ha-crumbs').innerHTML =
    `<a href="index.html">Home</a> / <a href="help-centre.html">Help Centre</a> / <a href="${helpTopicUrl(topic.id)}">${topic.name}</a> / ${q}`;
  document.getElementById('ha-title').textContent = q;
  const back = document.getElementById('ha-back');   // back to the article's topic (the green link, arrow in front, Cornel 2026-10-29)
  back.href = helpTopicUrl(topic.id); back.textContent = 'Back to ' + topic.name;
  document.getElementById('ha-text').innerHTML = HELP_ARTICLES[HELP_SLUG[q]] || '';   // help-content.js (live en-ie text)

  helpSide(document.getElementById('ha-side'), topic, HELP_SUBS[topic.id], helpTopicUrl(topic.id), hit.sub);   // M: the topic's sub-topics, the article's own marked   // the topics menu of the Help Centre home, the article's topic marked (Cornel, 2026-10-29)

  helpSwitch();
  document.querySelectorAll('[data-helpful]').forEach(b => b.addEventListener('click', () => showToast('Thanks for your feedback')));
}
</script>
</body>
</html>
