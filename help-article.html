<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Centre article</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle,delivery_truck_speed,error,local_mall,receipt,thumb_down,thumb_up,upload&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261105b">
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>

  <!-- Help Centre article page (2026-10-29): help-article.html?q=<question slug>. Desktop: left the sub-topic as a sidebar card
       (the hub topic card: icon + title, every question as a row, the current one marked, View all), right the full article.
       Mobile: the article first, the sidebar card below it. Content from help-data.js (shared with the hub). -->
  <main class="cat-page help-page">
    <section><p class="crumbs" id="ha-crumbs"></p></section>
    <section class="ha-grid">
      <aside class="ha-side" id="ha-side"></aside>
      <article class="ha-body">
        <h1 id="ha-title"></h1>
        <div class="ha-text" id="ha-text"></div>
        <div class="ha-helpful">
          <span>Was this article helpful?</span>
          <span class="btns">
            <button class="pill" type="button" aria-label="Yes" data-helpful><span class="material-symbols-rounded" aria-hidden="true">thumb_up</span></button>
            <button class="pill" type="button" aria-label="No" data-helpful><span class="material-symbols-rounded" aria-hidden="true">thumb_down</span></button>
          </span>
        </div>
      </article>
    </section>

    <footer class="footer" data-shell="footer"></footer>
  </main>
</div>

<script src="app.js?v=20261105b"></script>
<script src="help-data.js?v=20261105b"></script>
<script>
{ // own scope: app.js has globals like slug and sub
  const qSlug = new URLSearchParams(location.search).get('q') || 'can-i-change-my-order';
  const hit = helpFind(qSlug) || helpFind('can-i-change-my-order');
  const { q, a, topic, sub } = hit;
  document.title = q + ' | Help Centre';

  document.getElementById('ha-crumbs').innerHTML =
    `<a href="index.html">Home</a> / <a href="help-centre.html">Help Centre</a> / <a href="${helpTopicUrl(topic.id)}">${topic.name}</a> / ${q}`;
  document.getElementById('ha-title').textContent = q;
  document.getElementById('ha-text').innerHTML = HELP_ARTICLES[hslug(q)] || `<p>${a || 'The full answer comes from the live Help Centre.'}</p>`;

  // Sidebar = the hub topic card: the sub-topic (or the topic's questions), the current question marked, View all
  const list = sub ? sub.q.map(([x]) => x) : topic.q;
  document.getElementById('ha-side').innerHTML = `<div class="hc-card">
      <a class="hc-card-top" href="${helpTopicUrl(topic.id)}"><span class="hc-ico material-symbols-rounded" aria-hidden="true">${topic.ms}</span><span class="hc-card-h">${sub ? sub.name : topic.name}</span></a>
      <ul class="hc-qlist">${list.map(x => x === q
        ? `<li><a href="${helpUrl(x)}" aria-current="page">${x}</a></li>`
        : `<li><a href="${helpUrl(x)}">${x}<img class="chev" src="assets/category/arrow.svg" alt=""></a></li>`).join('')}</ul>
      <a class="link" href="${helpTopicUrl(topic.id)}">View all ${topic.n} articles</a>
    </div>`;

  helpSwitch();
  document.querySelectorAll('[data-helpful]').forEach(b => b.addEventListener('click', () => showToast('Thanks for your feedback')));
}
</script>
</body>
</html>
