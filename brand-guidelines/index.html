<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelloPrint Brand Guidelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261122e">
<link rel="stylesheet" href="../design-system/components.css?v=20261122e">
<style>
  /* Step 1 (2026-11-10): the folder and a start page. The sections get filled one by one. */
  html, body { background: var(--white); }
  .bg-top { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .bg-top .logo { height: 24px; }
  .bg-top b { padding-left: 16px; border-left: 1px solid var(--line); font-weight: 600; font-size: var(--t-14); color: var(--dark-grey); }
  .bg-main { max-width: 880px; margin: 0 auto; padding: 48px 24px 96px; }
  .bg-main h1 { font-size: var(--t-32); line-height: 40px; letter-spacing: -0.64px; }
  .bg-main > p { margin: 8px 0 32px; max-width: 640px; font-size: var(--t-16); line-height: 24px; color: var(--dark-grey); }
  .bg-list { border-top: 1px solid var(--line); }
  .bg-list li { display: flex; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: var(--t-16); line-height: var(--lh-16); }
  .bg-list small { color: var(--mid-grey); font-size: var(--t-14); }
  @media (max-width: 900px) {
    .bg-top { padding: 0 16px; }
    .bg-top .logo { height: 18px; }
    .bg-main { padding: 32px 16px 64px; }
  }
</style>
</head>
<body>
<header class="bg-top">
  <img class="logo" src="../prototype/assets/logo-dark.svg" alt="HelloPrint">
  <b>Brand Guidelines</b>
</header>
<main class="bg-main">
  <h1>Brand Guidelines</h1>
  <p>How HelloPrint looks and sounds. For the UI rules (tokens and components) see the <a href="../design-system/">UI Style Guide</a>.</p>
  <ul class="bg-list">
    <li>Logo<small>Coming soon</small></li>
    <li>Colour<small>Coming soon</small></li>
    <li>Typography<small>Coming soon</small></li>
    <li>Photography &amp; imagery<small>Coming soon</small></li>
    <li>Tone of voice<small>Coming soon</small></li>
  </ul>
</main>
</body>
</html>
