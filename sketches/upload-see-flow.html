<!-- SKETCH FRAME (not linked; Cornel 2026-11-20 "zo dicht mogelijk bij het voorbeeld, volgens onze UI guide"): the staging Upload & See flow
     (uas.staging.helloprint.dev, Classic Flyers A5) screen for screen, in the same order and with its wording, drawn with UI guide parts only.
     Every button works. Loaded by sketches/upload-see-map.html (the interaction map), which keeps mobile and desktop in step through postMessage.

<style>
  /* SKETCH CSS: only layout (the column, the two sides, the flyer pictures, the designer lines). No new components. */
  .co-dhead .co-right { margin-left: auto; }   /* account + cart stay right without the label */
  .us { display: flex; flex-direction: column; gap: 16px; padding-bottom: 32px; }
  .desk .us { grid-column: 1 / -1; width: 720px; margin: 0 auto; gap: 24px; padding-bottom: 64px; }
  .us h1 { margin: 0; }

  .desk .us > h2 { font-size: var(--t-24); line-height: 32px; letter-spacing: -0.48px; }
  /* card titles (the decision cards, the upgrades, the adjust panel): the guide's card title, semibold black, 14 mobile, 16/22 desktop */
  .us-offer h2, .us-adjust h2, .dash-card > h2 { font-weight: 600; font-size: var(--t-14); line-height: var(--lh-14); letter-spacing: 0; color: var(--black); }

  .us .lead, .us .confirm { margin: -8px 0 0; font-size: var(--t-14); line-height: var(--lh-14); color: var(--dark-grey); }
  .us .confirm { margin: 0; font-size: var(--t-12); line-height: var(--lh-12); text-align: center; }
  .us .center { align-self: center; text-align: center; }
  .us .links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .us-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .us-tools .seg { order: -1; width: 100%; }   /* mobile: the toggle a row of its own, the pills under it */
  .desk .us-tools .seg { order: 0; width: 240px; }
  .us-tools .pill .material-symbols-rounded { margin-right: 4px; font-size: 18px; }
  .us-legend { margin: -8px 0 0; font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); text-align: center; }
  /* Designer view's legend (as staging): a sample of each line next to what it means */
  body { --bleed: color-mix(in srgb, var(--orange) 22%, transparent); }   /* the bleed tint, also in the zoom popup */
  .us-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; margin: -8px 0 0; font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .us-key span { display: inline-flex; align-items: center; gap: 8px; }
  .us-key i { display: inline-block; width: 20px; }
  .us-key .k-cut { border-top: 1px dashed var(--error); }
  .us-key .k-bleed { height: 10px; border: 1px solid color-mix(in srgb, var(--orange) 50%, transparent); background: var(--bleed); }
  .us-key .k-safe { border-top: 1px dotted var(--dark-grey); }
  .us-sides { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; background: var(--light-grey); }
  .desk .us-sides { gap: 48px; padding: 32px 64px; }
  .us-sides.one { grid-template-columns: minmax(0, 240px); justify-content: center; }
  .desk .us-sides.one { grid-template-columns: minmax(0, 280px); }
  /* Zoom: the cart's artwork popup (openArt, .art-view) with the flyer as it prints on its grey stage, front and back */
  .art-stage > .art { position: absolute; inset: 0; width: auto; height: calc(100% - 32px); margin: auto; }
  .art-stage .art img { inset: auto; left: calc(50% + var(--dx, 0%)); top: calc(50% + var(--dy, 0%)); margin: 0; max-width: none; max-height: none; box-shadow: none; }   /* the popup's picture rules (centred, max size) are for a plain picture: the flyer keeps its own fit */
  .art-thumbs > span > .art { width: auto; height: 48px; }
  .us-side > .art { cursor: zoom-in; }
  .us-side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; font-size: var(--t-14); line-height: var(--lh-14); }
  .us-side > b { font-weight: 600; }
  .us-side .acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .us-side .addr-add { flex: none; width: 100%; aspect-ratio: 148 / 210; justify-content: center; }
  .us-side .addr-add .material-symbols-rounded { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 4px; border: 1px solid var(--mid-grey); border-radius: 50%; background: var(--white); transition: border-color .15s; }   /* the + in a round outline, as a button (Cornel 11-24) */
  .us-side .addr-add:hover .material-symbols-rounded { border-color: var(--light-green); }
  .us-side .gone { display: grid; place-items: center; width: 100%; aspect-ratio: 148 / 210; padding: 16px; border-radius: var(--r-m); background: var(--white); color: var(--dark-grey); font-size: var(--t-12); line-height: var(--lh-12); text-align: center; }
  /* the flyer: A5 portrait; the landscape file filled (cropped), shown all (white above and under) or turned */
  .art { position: relative; display: block; width: 100%; aspect-ratio: 148 / 210; overflow: hidden; background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: transform .4s; }
  /* the design keeps its own shape (Cornel 11-23): its size comes from the fit (--iw, --ih: cover for Fill, contain for Show all and Turn), moving pans over it */
  .art img { position: absolute; left: calc(50% + var(--dx, 0%)); top: calc(50% + var(--dy, 0%)); width: var(--iw, 100%); height: var(--ih, 100%); max-width: none; object-fit: fill; transform: translate(-50%, -50%) scale(var(--sc, 1)); }
  .art.turned img { transform: translate(-50%, -50%) rotate(90deg) scale(var(--sc, 1)); }
  /* Turn it over: the flyer as a card with two faces that really turns (as staging); without motion it just changes */
  .us-flip { width: 100%; aspect-ratio: 148 / 210; perspective: 1200px; cursor: pointer; }
  .us-flip .us-turn { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.7,.2,1); }
  .us-flip.flipped .us-turn { transform: rotateY(180deg); }
  .us-flip .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .us-flip .face.back { transform: rotateY(180deg); }
  .us-flip .face .gone, .us-flip .face .empty { height: 100%; }
  .us-flip .empty { display: grid; place-items: center; background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.12); color: var(--dark-grey); font-size: var(--t-14); }
  @media (prefers-reduced-motion: reduce) { .us-flip .us-turn { transition: none; } }
  /* the photo that may print blurry: marked only while the customer looks at its point (hover or tap on the row), with its label */
  .art .blur { display: none; position: absolute; left: 18%; top: 30%; width: 34%; height: 22%; border: 2px solid var(--orange); border-radius: var(--r-s); }
  .art .blur .badge { left: -2px; top: auto; bottom: calc(100% + 4px); white-space: nowrap; }
  .art .cut, .art .safe { position: absolute; pointer-events: none; }
  .art .cut { inset: 2%; border: 1px dashed var(--error); box-shadow: 0 0 0 999px var(--bleed); }   /* outside the cut: the bleed, lightly tinted */
  .art .safe { inset: 5%; border: 1px dotted var(--dark-grey); }

  .us-adjust .lead { margin: -8px 0 0; }
  .us-adj { position: relative; width: 200px; margin: 8px auto 0; touch-action: none; cursor: grab; }
  .desk .us-adj { width: 240px; }
  .us-handle { position: absolute; right: -12px; bottom: -12px; width: 24px; height: 24px; border: 3px solid var(--white); border-radius: 50%; background: var(--light-green); box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: nwse-resize; touch-action: none; }
  .us-adjust .art-note { margin: 0; }
  .us-adjust .pills-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .us-adjust .btn { align-self: flex-end; }
  .file-check .pills-row { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .file-check .link { margin-left: 8px; font-size: var(--t-12); }
  .file-check .dot { display: block; }
  .us .up-check { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .us .up-check .ok { margin: 0; }
  .art-note-text { width: 100%; }
  /* The three upgrades (Cornel 2026-11-23: a real upsell, in UI guide parts): one question per screen; a card with the customer's own flyer on
     the grey stage (the check cards' stage), what it adds as product card ticks and the difference in price; Yes / No as buttons under it, not full width */
  .us-up { display: flex; flex-direction: column; gap: 16px; }
  .us-up .us-up-track { grid-column: auto; width: 144px; margin-top: 8px; }   /* staging's three dashes: the compact tracker, short, so it doesn't read as the steps' bars above it */
  .us-up .tracker-now { grid-column: auto; margin: -8px 0 -8px; }
  .us-offer { display: grid; gap: 16px; padding: 0; overflow: hidden; }
  .desk .us-offer { grid-template-columns: 280px 1fr; gap: 0; padding: 0; }
  .us-offer .us-stage { height: 200px; margin: 0; border-radius: 0; }
  .desk .us-offer .us-stage { height: 100%; min-height: 240px; }
  .us-offer .us-stage .art { height: 150px; }
  .us-offer .us-stage { isolation: isolate; }
  .us-lift .art { transform: rotate(-4deg); box-shadow: 0 12px 24px rgba(0,0,0,.18); }   /* paper: lifted off the table, you feel the sheet */
  .us-fan { position: relative; display: grid; place-items: center; }
  .us-offer .us-fan .art { grid-area: 1 / 1; height: 124px; }
  .us-fan .art:nth-child(1) { transform: translate(-28px, 6px) rotate(-10deg); }   /* quantity: a fan of three flyers */
  .us-fan .art:nth-child(3) { transform: translate(28px, 6px) rotate(10deg); }
  .us-cal-pair { display: flex; align-items: center; gap: 12px; color: var(--dark-grey); }
  .us-cal-pair .cal { display: block; transform: scale(1.4); margin: 0 12px; }
  .us-cal-pair .was { opacity: .45; }
  .us-swap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }   /* what you have → what you get, as the card's title */
  .us-swap span { font-weight: 400; color: var(--dark-grey); }
  .us-swap svg { color: var(--light-green); }
  .us-offer .us-stage .badge { left: 12px; top: 12px; }
  .us-offer .tx { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
  .desk .us-offer .tx { padding: 24px; }
  .us-offer h2 { margin: 0; }
  .us-offer .tx > ul { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; }
  .us-offer .tx > ul li { display: flex; gap: 8px; font-size: var(--t-14); line-height: var(--lh-14); }
  .us-offer .tx > ul li svg { flex-shrink: 0; margin-top: 3px; color: var(--light-green); }
  .us-offer .plus { font-weight: 800; font-size: var(--t-24); line-height: var(--lh-tight); }
  .us-offer .plus small { display: block; margin-top: 4px; font-weight: 400; font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .us-up-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .us-up-acts .btn { padding: 0 24px; }
  .us-dc .tx .us-up-acts { margin-top: 4px; }
  .us-up-acts .btn .material-symbols-rounded { margin-right: 6px; font-size: 20px; }
  /* decision cards (?dc=1): the upgrades' card on every decision moment */
  .us-dc .us-stage .art { height: 150px; }
  .us-dc .us-stage { height: auto; min-height: 200px; }   /* the stage grows with its flyer (a turning flyer is taller), so it always fits */
  .us-win .us-dc-ok { padding: 12px 16px; border-radius: var(--r-m); background: var(--cream); }   /* approve: only "good to go" as a cream bar (the upload's reassurance colour), the rest of the card white (Cornel 11-23) */   /* approve: the success cream of the upload's reassurance block (.art-calm) */
  .us-dc .us-stage.spot .art .blur { display: block; }
  .us-dc-fly { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 0; }
  .us-dc-fly .us-flip, .us-dc-fly .us-flip .us-turn, .us-dc-fly .us-flip .face { display: block; }
  .us-dc-fly .us-flip { width: 168px; }
  .us-dc-fly .us-flip .art { height: auto; width: 100%; }
  .us-dc-fly small { font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .us-dc .file-check ul { gap: 12px; }
  .us-dc-state { display: flex; gap: 8px; margin: 0; font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }   /* body text: 12/18 mobile, 14/22 desktop, grey under a black title */
  .desk .us-dc-state { font-size: var(--t-14); line-height: var(--lh-14); }
  .us-dc-state img, .us-dc-state .dot { flex-shrink: 0; width: 20px; height: 20px; }

  html:not(.desk) .us-dc-state img { width: 18px; height: 18px; }
  .us-dc-side { display: block; margin-bottom: -8px; font-size: var(--t-12); line-height: var(--lh-12); font-weight: 600; color: var(--dark-grey); }   /* Front / Back, when both sides have their own file */
  /* filled: the whole design with the flyer on it; what falls outside is light (the cut line red dashed, as Designer view) */
  .us-cut { position: relative; display: block; height: 150px; max-width: 100%; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .us-cut img { width: 100%; height: 100%; object-fit: cover; }
  .us-cut i { position: absolute; left: 50%; top: 50%; aspect-ratio: 148 / 210; transform: translate(-50%, -50%); border: 1px dashed var(--error); box-shadow: 0 0 0 999px color-mix(in srgb, var(--white) 65%, transparent); }
  /* a small picture: a close look at its pixels, as they would print */
  .us-lens { position: absolute; right: calc(50% - 88px); bottom: 16px; width: 72px; height: 72px; border: 3px solid var(--white); border-radius: 50%; background-size: 600%; background-position: 40% 45%; image-rendering: pixelated; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .us-dc-ok { display: flex; align-items: center; gap: 8px; }
  .us-dc-ok img { width: 20px; height: 20px; }
  .us-up-back { margin: -8px 0 0; }
  .desk .us .fc-list { flex-direction: row; }
  .desk .us .fc { flex: 1; }
  .us-no { color: var(--mid-grey); font-weight: 600; }
  /* The check choice (Cornel 2026-11-23, sketch B): the cart's check cards, every card the same rows (a tick or a grey dash) so they compare;
     the ticks of the product cards (thin, not filled); on desktop on top of each card the customer's own flyer with what that check does (as staging) */
  .us-fcb .lab { display: flex; min-height: 20px; }

<script>
{
  const q = new URLSearchParams(location.search);
  const ic = n => `<span class="material-symbols-rounded" aria-hidden="true">${n}</span>`;
  const TICK = '<img src="assets/pdp/check.svg" alt="">', DOT = '<span class="dot" aria-hidden="true"></span>';
  const WIDE = 'assets/proofs/leaflet.png';   // the customer's file: landscape, one page
  const hs = n => ` data-hs="${n}"`;
  const fmt = n => '€' + n.toFixed(2);
  const TIERS = [['Basic Check + Proof', 0, ['Print proof before production', 'Automated checks on resolution, size & colour settings']],
    ['Premium Check + Proof', 10.99, ['Everything in Basic, plus:', 'All file formats accepted', 'Design support from our experts', 'AI-powered optimisation'], true],
    ['Deluxe', 21, ['Everything in Premium, plus:', 'Perfect design guaranteed', 'Personal extra file-check, prioritised by our experts']]];
  // The upgrades: [key, step name, question, offer title, [what you have now, what you get], what it adds, price, label, No]
  const UPS = { up1: ['paper', 'Paper thickness', 'Print it on thicker paper?', 'Standard 170 gsm', ['Budget 135 gsm', 'Standard 170 gsm'], ['Sturdier in the hand: it feels like quality', 'Our recommended thickness for flyers', 'Same design, same delivery date'], 4, 'Recommended', 'No, keep Budget 135 gsm'],
    up2: ['qty', 'Quantity', 'Make it 2,000 flyers?', '1,000 extra flyers', ['€0.033 a flyer', '€0.026 a flyer'], ['Enough for a second round or a second location', 'Same design, printed in the same run', 'Same delivery date'], 17.5, 'Save 21% a flyer', 'No, keep 1,000'],
    up3: ['deliv', 'Delivery', 'Get it a week sooner?', 'Standard delivery', ['Tue 1 Dec', 'Tue 24 Nov'], ['Estimated Tue 24 Nov — latest Wed 25 Nov', 'Tracked, with updates by e-mail', 'Handy when your event is close'], 42.5, '', 'No, keep Saver'] };

  // The state of the flow: the screen, what the customer chose, what is open. The map sends it to the other frame, so both stay in step.
  const START = { st: 'upload', front: 'fill', back: 'empty', photo: null, view: 'both', flipped: false, designer: false, note: false,
    check: 0, paper: false, qty: false, deliv: false, sheet: null, adjust: false, sc: 1, dx: 0, dy: 0, phone: 0,
    file: null, backSrc: null, bk: null, load: null };   // bk: the back's own settings when it is its own file (fit, sc, dx, dy, ratio, kind, w, h)   // file: the customer's own file (read in this browser, nothing is sent); null = the sample
  let S = { ...START, st: q.get('st') || 'upload', check: q.has('check') ? +q.get('check') : 0, back: q.get('back') || 'empty' };

  // The check choice (sketch B, Cornel 2026-11-23): the three cards with the same rows; desktop: the customer's flyer on top of each card
  const FEAT = [['Print proof before we print', 1, 1, 1], ['Automatic check: size, resolution, colour', 1, 1, 1], ['All file formats accepted', 0, 1, 1],
    ['Help from our experts', 0, 1, 1], ['AI-powered optimisation', 0, 1, 1], ['A personal extra check, first in line', 0, 0, 1], ['Perfect design guaranteed', 0, 0, 1]];
  const KEY = [0, 3, 5];   // on the cards only the three rows that tell the checks apart; all seven in See all the differences (as live)
  const SHORT = ['Basic', 'Premium', 'Deluxe'], NO = '<span class="us-no" aria-label="Not included">–</span>';
  const USP = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';   // the product cards' tick
  const price = i => TIERS[i][1] ? fmt(TIERS[i][1]) : 'Free';
  // the customer's own flyer on each card, with the check's icon in the corner; no cut lines, glow or magnifier (Cornel 11-24)
  const stage = i => `<span class="us-stage">${i === 1 ? badgeHtml('Recommended') : ''}${art()}<span class="ico">${ic(['check', 'auto_awesome', 'group'][i])}</span></span>`;
  const checkCards = () => `<div class="fc-list us-fcb" role="radiogroup">${TIERS.map(([n], i) => `<button class="fc" role="radio" aria-checked="${S.check === i}" data-go="check-${i}"${hs(i + 1)}>
    ${DESK ? stage(i) : `<span class="lab">${i === 1 ? badgeHtml('Recommended') : ''}</span>`}<span class="fc-top"><span class="radio"></span><b>${SHORT[i]}</b><span class="fc-price">${price(i)}</span></span>
    <ul>${KEY.map(k => FEAT[k]).map(([t, ...c]) => `<li class="${c[i] ? '' : 'off'}">${c[i] ? USP : NO}${t}</li>`).join('')}</ul></button>`).join('')}</div>`;
  if (q.get('hot')) document.body.classList.add('hot');

  const total = () => 33.49 - (S.back === 'one' ? 4 : 0) + (S.check ? TIERS[S.check][1] : 0) + (S.paper ? 4 : 0) + (S.qty ? 17.5 : 0) + (S.deliv ? 42.5 : 0);
  const eta = () => S.deliv ? 'Estimated Tue 24 Nov — latest Wed 25 Nov' : 'Estimated Tue 1 Dec — latest Wed 2 Dec';

  // THE CUSTOMER'S FILE (functional, Cornel 2026-11-23): a real PDF, JPG or PNG, read in this browser (pdf.js for a PDF), nothing is sent.
  // Without one (jumping in from the map) the sample shows: a landscape file with one page and a blurry photo.
  const A5 = [148, 210], A5R = 148 / 210;
  const frontSrc = () => S.file?.pages[0] || WIDE;
  const backSrc = () => S.back === 'file' ? (S.backSrc || frontSrc()) : frontSrc();
  // EACH SIDE ITS OWN SETTINGS (Cornel 11-23: a front and a back from two files are placed one by one): the front's fit/size/move live in S.front, S.sc,
  // S.dx, S.dy; the back's in S.bk when the back is its own file, else the back follows the front (same design)
  const own = side => side === 'back' && S.back === 'file' && !!S.bk;
  const sd = (side = 'front') => own(side) ? S.bk : { fit: S.front, sc: S.sc, dx: S.dx, dy: S.dy };
  const setSd = (side, p) => { if (own(side)) Object.assign(S.bk, p); else { if ('fit' in p) S.front = p.fit; ['sc', 'dx', 'dy'].forEach(k => k in p && (S[k] = p[k])); } };
  const owner = side => own(side) ? 'back' : 'front';
  const fixed = side => ['turned', 'all'].includes(sd(side).fit);
  const ratio = (side = 'front') => own(side) && S.bk.ratio ? S.bk.ratio : S.file ? S.file.ratio : 297 / 210;   // the sample: A4 landscape
  const shape = side => { const r = ratio(side); return r > 1.05 ? 'land' : Math.abs(r - A5R) / A5R < .04 ? 'match' : 'odd'; };   // landscape, A5's own shape, or another shape
  const cutMm = side => { const r = ratio(side); return Math.round(r > A5R ? (A5[1] * r - A5[0]) / 2 : (A5[0] / r - A5[1]) / 2); };   // filled: what falls off at each side
  const cutSides = side => ratio(side) > A5R ? 'left and right' : 'at the top and bottom';
  const px = side => own(side) ? S.bk : S.file;   // the pixels of an image (w, h, kind)
  const dpi = (side = 'front') => { const f = px(side); if (!f || f.kind !== 'img') return 0; return Math.round(ratio(side) > A5R ? f.h / (A5[1] / 25.4) : f.w / (A5[0] / 25.4)); };   // an image, filled on A5
  const lowres = (side = 'front') => (side === 'front' && !S.file) || (px(side)?.kind === 'img' && dpi(side) < 150);   // the sample has its blurry photo
  const pageMm = () => S.file?.kind === 'pdf' ? S.file.mm : null;
  const hasBleed = () => { const m = pageMm(); return !!m && Math.abs(m[0] - 154) < 2 && Math.abs(m[1] - 216) < 2; };
  const sizeText = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
  // The flyer picture: the file as the customer chose it (front, or the back side); the designer lines (cut, keep text inside) when Designer view is on
  // The picture's size in % of the flyer (width, height), from the design's shape and the fit: Fill covers the flyer, Show all fits in it, Turn fits it turned
  const imgPct = side => { const r = ratio(side), d = sd(side), W = 1, H = 1 / A5R;
    if (d.fit === 'turned') { const rr = 1 / r, s = Math.min(H, W / rr); return [s * 100 / W, s * rr * 100 / H]; }   // the element before it turns: its width is the turned height
    const s = d.fit === 'fill' ? Math.max(H, W / r) : Math.min(H, W / r); return [s * r * 100 / W, s * 100 / H]; };
  // How far it may move: filled, only as far as the design still covers the flyer (no white edge); otherwise freely, up to 40%
  const clampMove = (side, dx, dy) => { const d = sd(side); if (d.fit !== 'fill') return [Math.max(-40, Math.min(40, dx)), Math.max(-40, Math.min(40, dy))];
    const [w, h] = imgPct(side), lx = Math.max(0, (w * d.sc - 100) / 2), ly = Math.max(0, (h * d.sc - 100) / 2);
    return [+Math.max(-lx, Math.min(lx, dx)).toFixed(1), +Math.max(-ly, Math.min(ly, dy)).toFixed(1)]; };
  const move = (side, dx, dy) => { const [x, y] = clampMove(side, dx, dy); setSd(side, { dx: x, dy: y }); };
  const art = (cls = '', extra = '', side = 'front') => { const d = sd(side), [iw, ih] = imgPct(side); return `<span class="art ${d.fit === 'turned' ? 'turned' : d.fit === 'all' ? 'all' : ''} ${cls}" data-own="${owner(side)}" style="--sc:${d.sc};--dx:${d.dx}%;--dy:${d.dy}%;--iw:${iw.toFixed(2)}%;--ih:${ih.toFixed(2)}%"><img src="${side === 'back' ? backSrc() : frontSrc()}" alt="">${S.designer || cls.includes('lines') ? '<i class="cut"></i><i class="safe"></i>' : ''}${extra}</span>`; };
  const sideAttr = side => side && side !== 'front' ? ` data-side="${side}"` : '';
  const btn = (go, t, n, cls = 'outline small', side) => `<button class="btn ${cls}" data-go="${go}"${sideAttr(side)}${hs(n)}>${t}</button>`;
  const pill = (go, t, n, on, side) => `<button class="pill${on ? ' active' : ''}" data-go="${go}"${sideAttr(side)}${hs(n)}>${t}</button>`;
  const link = (go, t, n) => `<button class="link" data-go="${go}"${hs(n)}>${t}</button>`;

  // The steps: the round back button to the product, then Your file · Check · Approve (staging: … · Basket, a step that never comes)
  function steps() {
    const at = { upload: 0, sending: 0, preview: 0, choice: 1, result: 1 }[S.st] ?? 2, ol = document.getElementById('steps');
    ol.className = 'co-steps' + (DESK ? ' co-steps-n' : ''); ol.style.gridTemplateColumns = 'repeat(4, 1fr)';
    ol.innerHTML = `<li class="done"><a href="#product">Product</a></li>` + ['Your file', 'Check', 'Approve'].map((t, i) =>
      `<li class="${i < at ? 'done' : i === at ? 'current' : ''}"${i === at ? ' aria-current="step"' : ''}>${DESK ? `<span class="n">${i + 1}</span>` : ''}${t}</li>`).join('');
  }

  // The order bar (staging: the Total · delivery · Next card under the preview): desktop .d-bar, mobile .buy-bar
  function bar(label, go, n, disabled) {
    if (!label) return '';
    return DESK
      ? `<div class="d-bar show"><div class="dwrap"><span class="d-bar-prod"><span class="thumb"><img src="${frontSrc()}" alt=""></span><span class="t"><b>Classic Flyers</b><small>A5 · ${S.qty ? '2,000' : '1,000'} · Glossy · ${S.paper ? 'Standard 170' : 'Budget 135'} gsm · ${S.back === 'one' ? 'single' : 'double'}-sided</small></span></span>
          <span class="d-bar-eta">${TICK}${eta()}</span><span class="d-bar-total"><b>${fmt(total())}</b><small>excl. VAT</small></span>
          <button class="btn primary d-go" data-go="${go}"${hs(n)}${disabled ? ' disabled' : ''}>${label}</button></div></div>`
      : `<div class="buy-bar show"><div class="sheet-bar"><div class="total"><strong>${fmt(total())}</strong><span class="bar-sub"><span>excl. VAT</span> ·${TICK}<span>${eta().replace('Estimated ', '').replace(/ —.*/, '')}</span></span></div><button class="btn primary" data-go="${go}"${hs(n)}${disabled ? ' disabled' : ''}>${label}</button></div></div>`;
  }
  const team = n => `<div class="oc-team"><span class="faces"><img src="assets/help/team/saskia.webp" alt=""><img src="assets/help/team/timo.webp" alt=""><img src="assets/help/team/karen.webp" alt=""></span><span>A question about your file? Our team looks at it with you. <a href="#chat"${hs(n)}>Start chat</a></span></div>`;

  // Every screen: its HTML and its bar. The numbers (data-hs) are the ones in the map's list (IA below).
  const SCREENS = {
    upload: () => [`<h1>Upload your flyer design</h1><p class="lead">A PDF, JPG or PNG is all we need. We put it on your flyer and show it to you straight away.</p>
      <div class="art-drop"><img src="assets/desktop/upload-cloud.svg" alt=""><b>Your file</b><button class="btn primary" data-go="pick"${hs(1)}>Upload my file or files</button><small>PDF, JPG or PNG. Drop it here, or choose it from your device.</small></div>
      <p class="art-note">Photos on your phone? Scan a code and send them here. <button class="link" data-go="phone"${hs(2)}>Use your phone</button></p>${team(3)}`, ''],

    sending: () => { const L = S.load || { name: 'flyer-a5-landscape.pdf', size: 2e5, ext: 'pdf', step: 1 }, at = j => j < L.step ? TICK : j === L.step ? DOT : '<span></span>';
      return [`<h1>Your file is on its way</h1>
      <div class="up-file"><span class="up-ico">${L.ext.toUpperCase().slice(0, 4)}</span><div class="t"><b>${L.name.replace(/</g, '&lt;')}</b><small>${sizeText(L.size)}${L.step ? ' received' : ''}</small><span class="up-bar"><i style="width:${[30, 65, 90, 100][L.step]}%"></i></span></div></div>
      <div class="dash-card file-check"><ul aria-label="Progress"><li>${at(0)}<b>Sending your file</b><small>${sizeText(L.size)}</small></li><li>${at(1)}<b${L.step < 1 ? ' style="color:var(--dark-grey)"' : ''}>Reading your pages</b><small>Looking at what’s in your file…</small></li><li>${at(2)}<b${L.step < 2 ? ' style="color:var(--dark-grey)"' : ''}>Making your preview</b><small>So you can see exactly how your flyer will look</small></li></ul></div>
      <div class="up-check"><p class="ok">${TICK}Your file stays private. Nothing is printed until you approve it.</p></div>`, '']; },

    preview: () => {
      const one = S.view === 'over';
      const tools = `<div class="us-tools">${pill('zoom', `${ic('zoom_in')}Zoom in`, 1)}
        <div class="seg" role="radiogroup" aria-label="View"><button role="radio" aria-checked="${!one}" data-go="both"${hs(2)}>Both sides</button><button role="radio" aria-checked="${one}" data-go="over"${hs(3)}>Turn it over</button></div>
        ${pill('designer', 'Designer view', 4, S.designer)}</div>${S.designer ? '<p class="us-key"><span><i class="k-cut"></i>Where we cut</span><span><i class="k-bleed"></i>Bleed: printed past the cut, then trimmed off</span><span><i class="k-safe"></i>Safety margin: keep text and logos inside</span></p>' : ''}`;
      const front = `<div class="us-side">${S.front === 'none' ? `<button class="addr-card addr-add" data-go="pick"${hs(5)}>${ic('add')}Add your front</button>` : art('', S.photo || S.file ? '' : '<i class="blur"><span class="badge">This photo</span></i>').replace('<span class="art', '<span data-go="zoom-0" class="art')}<b>Front</b>
        ${S.front === 'none' ? '' : `<span class="acts">${btn('adjust', 'Move or resize', 5)}${btn('other', 'Other file', 6)}${shape('front') === 'land' ? btn('turn', S.front === 'turned' ? 'Turn back' : 'Turn', 7) : ''}${btn('remove', 'Remove', 8)}</span>`}</div>`;
      const back = S.back === 'empty' ? `<div class="us-side"><button class="addr-card addr-add" data-go="pick"${hs(9)}>${ic('add')}Add your back<small>A PDF or a picture</small></button><b>Back</b><span class="acts">${btn('same', 'Same design', 10)}${btn('one', 'One side only', 11)}</span></div>`
        : S.back === 'same' || S.back === 'file' ? `<div class="us-side">${art('', '', 'back').replace('<span class="art', '<span data-go="zoom-1" class="art')}<b>Back</b><span class="acts">${S.back === 'file' ? btn('adjust', 'Move or resize', 5, undefined, 'back') : ''}${btn('other-back', 'Other file', 6)}${own('back') && shape('back') === 'land' ? btn('turn', S.bk.fit === 'turned' ? 'Turn back' : 'Turn', 7, undefined, 'back') : ''}${btn('back-empty', 'Remove', 8)}</span></div>`
        : `<div class="us-side"><span class="gone">Printed on one side only<br>You save €4.00</span><b>Back</b><span class="acts">${btn('back-empty', 'Print both sides', 11)}</span></div>`;
      const face = S.back === 'same' || S.back === 'file' ? art('', '', 'back') : S.back === 'one' ? '<span class="gone">Printed on one side only</span>' : '<span class="empty">Your back is still empty</span>';
      const sides = one ? `<div class="dash-card us-sides one"><div class="us-flip${S.flipped ? ' flipped' : ''}" data-go="flip"${hs(3)} role="button" aria-label="Turn the flyer over"><div class="us-turn"><div class="face">${art()}</div><div class="face back">${face}</div></div></div><p class="us-legend" style="margin:0" id="flipCap">${S.flipped ? 'The back' : 'The front'} · tap the flyer to turn it over</p></div>`
        : `<div class="dash-card us-sides">${front}${back}</div>`;
      // Move or resize: the panel above the preview (staging), the design with the designer lines, the corner to pull
      const as = S.adjust, ad = as && sd(as);   // the side being adjusted
      const adjust = as && S.front !== 'none' ? `<div class="dash-card us-adjust" id="adjPanel"><h2>Adjust the ${as}</h2><p class="lead">Drag your design, pull its corner, or use the buttons and arrow keys.</p>
        <div class="us-adj" data-drag${hs(22)}>${art('lines', '', as)}<span class="us-handle" data-resize aria-label="Pull to resize"${hs(23)}></span></div>
        ${ad.fit === 'fill' && ad.sc >= 1 && shape(as) !== 'match' ? '<p class="art-note">Part of your design will be cut off.</p>' : ad.fit === 'all' || ad.sc < 1 ? '<p class="art-note">All of your design is on the flyer.</p>' : ''}
        <div class="pills-row">${pill('smaller', 'Smaller', 24)}${pill('bigger', 'Bigger', 25)}${pill('fit-fill', 'Fill', 26, ad.fit === 'fill', as)}${pill('fit-all', 'Show all', 27, ad.fit === 'all', as)}${pill('centre-x', 'Centre ↔', 28)}${pill('centre-y', 'Centre ↕', 29)}</div>
        <button class="btn primary small" data-go="adj-done"${hs(30)}>Done</button></div>` : '';
      return [`<h1>There it is: your flyer</h1>${tools}${adjust}${sides}${S.front !== 'none' ? aboutCards() : ''}
        ${S.note ? `<textarea class="art-note-text" rows="3" placeholder="For example: the back is the same as the front" aria-label="A note for our team"${hs(17)}></textarea>` : `<p class="center">${link('note', 'Something we should know about your file?', 17)}</p>`}
        <p class="center">${link('upload', 'Start again with another file', 18)}</p>${team(19)}`, bar('Next: check my file', 'choice', 20)];
    },

    choice: () => [`<h1>How carefully should we check it?</h1><p class="lead">Every file gets the free check. Choose more if you want our experts to look.</p>
      ${checkCards()}
      <button class="btn outline center" data-go="diff"${hs(4)}>See all the differences</button>
      <p class="links">${link('preview', 'Back to my flyer', 5)}</p>${team(6)}`,
      bar('Check my file', 'result', 7)],   // Basic is chosen from the start (every file gets the free check, Cornel 11-23)

    cart: () => [`<div class="art-calm"><b>${TICK}Added to cart</b><span>Classic Flyers A5 · ${S.qty ? '2,000' : '1,000'} · ${fmt(total())} excl. VAT</span></div>
      ${dcard(flipStage(), `<div class="file-check"><ul aria-label="In your order"><li>${TICK}<b>${S.file ? S.file.name.replace(/</g, '&lt;') : 'Your file'}</b><small>${S.front === 'turned' ? 'Turned to fit' : S.front === 'all' ? 'All of it shown' : 'Filled'} · back: ${S.back === 'same' ? 'same design' : S.back === 'file' ? 'your back' : S.back === 'one' ? 'one side only' : 'empty'}</small></li>
        <li>${TICK}<b>${TIERS[S.check][0]}</b><small>${S.check ? fmt(TIERS[S.check][1]) : 'Free'}</small></li>
        <li>${TICK}<b>${S.paper ? 'Standard 170 gsm' : 'Budget 135 gsm'} · ${S.deliv ? 'Standard' : 'Saver'} delivery</b><small>${eta()}</small></li></ul></div>`)}
      <a class="btn primary center" href="cart.html" target="_top"${hs(1)}>Go to cart</a>
      <p class="center">${link('restart', 'Start this flow again', 2)}</p>`, '']
  };
  // The three upgrades after Approve (staging: one question per screen, three bars on top)
  const ARROW = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const cal = (m, d, wd, on) => `<span class="d-cal-card${on ? '' : ' was'}" aria-checked="${on}"><span class="cal" aria-hidden="true"><i>${m}</i><b>${d}</b><small>${wd}</small></span></span>`;   // the Delivery tile's calendar (chosen: the green head)
  Object.entries(UPS).forEach(([st, [key, step, title, offer, [was, gets], adds, plus, label, no]], i) => SCREENS[st] = () => {
    // the picture, on the check cards' grey stage: the customer's own flyer (paper: lifted, so you feel it; quantity: a fan of flyers), delivery: the date
    const pic = key === 'deliv' ? `<span class="us-cal-pair">${cal('Dec', '1', 'Tue', false)}${ARROW}${cal('Nov', '24', 'Tue', true)}</span>`
      : key === 'qty' ? `<span class="us-fan">${art()}${art()}${art()}</span>` : `<span class="us-lift">${art()}</span>`;
    return [`<div class="us-up"><ol class="tracker compact us-up-track" aria-hidden="true">${[0, 1, 2].map(j => `<li class="${j < i ? 'done' : j === i ? 'now' : ''}"></li>`).join('')}</ol>
      <p class="tracker-now">Upgrade ${i + 1} of 3 · <b>${step}</b></p><h1>${title}</h1>
      <div class="dash-card us-offer"><span class="us-stage">${label ? badgeHtml(label) : ''}${pic}</span>
        <div class="tx"><h2 class="us-swap"><span>${was}</span>${ARROW}${gets}</h2>
          <ul>${adds.map(t => `<li>${USP}${t}</li>`).join('')}</ul>
          <span class="plus">+${fmt(plus)}<small>Your order now ${fmt(total())} · with this ${fmt(total() + plus)}</small></span></div></div>
      <div class="us-up-acts"><button class="btn primary" data-go="yes-${key}"${hs(1)}>Yes, add it · +${fmt(plus)}</button><button class="btn outline" data-go="no-${key}"${hs(2)}>${no}</button></div>
      <p class="us-up-back">${link(`back-${st}`, ['Back to approve', 'Back to the paper', 'Back to the quantity'][i], 3)}</p></div>`,
      bar('Add to cart', 'to-cart', 4)];   // the order bar stays (total and date follow each Yes); its button skips the rest and adds to cart
  });

  // DECISION CARDS (sketches/upload-see-cards-sketch.html; Cornel 2026-11-23: About your file, check result and approve; Upload and Sending stay as they are "die style van de upsells doorvoeren, de onderdelen goed geconnect"):
  // every decision moment one card, as the upgrades: the customer's own flyer on the grey stage, fused with the text (one title that says what it is
  // about, the consequence), the actions right under the card; the order bar stays the anchor for the total
  // acts: under the card (a step, as the upgrades); inAct: inside the card, under the text (a choice that belongs to the card: About your file, Cornel 11-23)
  const dcard = (stage, inner, acts = '', cls = '', inAct = '') => `<div class="dash-card us-offer us-dc"><span class="us-stage ${cls}">${stage}</span><div class="tx">${inner}${inAct ? `<div class="us-up-acts">${inAct}</div>` : ''}</div></div>${acts ? `<div class="us-up-acts">${acts}</div>` : ''}`;
  const twoSides = () => S.back === 'same' || S.back === 'file';
  const flipStage = () => !twoSides() ? `<span class="us-dc-fly">${art()}<small>Front</small></span>`
    : `<span class="us-dc-fly"><span class="us-flip${S.flipped ? ' flipped' : ''}" data-go="flip" role="button" aria-label="Turn the flyer over"><span class="us-turn"><span class="face">${art()}</span><span class="face back">${art('', '', 'back')}</span></span></span><small id="flipCap">${S.flipped ? 'The back' : 'The front'} · tap to turn it over</small></span>`;
  // The check, from the file: its size and pages, front and back, bleed, sharpness (an image: its dpi), letters (a PDF) or text in a picture (an image)
  const checkRows = () => { const f = S.file, m = pageMm(), img = f?.kind === 'img', n = f?.n || 1;

    if (S.st !== st || NAV.includes(k)) scrollTo(0, 0);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(true); } });
  // Move or resize: drag the design, pull the corner (bigger or smaller), the arrow keys move it 1% of the flyer
  let drag = null;
  const live = () => document.querySelectorAll(`.art[data-own="${owner(S.adjust)}"]`).forEach(a => { const d = sd(S.adjust); a.style.setProperty('--dx', d.dx + '%'); a.style.setProperty('--dy', d.dy + '%'); a.style.setProperty('--sc', d.sc); });
  document.addEventListener('pointerdown', e => {
    const r = e.target.closest('[data-resize]'), d = !r && e.target.closest('[data-drag]'); if (!r && !d) return;
    const box = (r || d).closest('.us-adj').querySelector('.art').getBoundingClientRect();   // the flyer next to the handle   // moving is kept in % of the flyer, so it stands the same at every size (the preview, the popup, the cards)
    const d0 = sd(S.adjust); drag = r ? { resize: true, x: e.clientX, y: e.clientY, sc: d0.sc } : { x: e.clientX, y: e.clientY, dx: d0.dx, dy: d0.dy, w: box.width, h: box.height };
    (r || d).setPointerCapture(e.pointerId); e.preventDefault();
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (drag.resize) { setSd(S.adjust, { sc: +Math.max(.5, Math.min(2, drag.sc + ((e.clientX - drag.x) + (e.clientY - drag.y)) / 300)).toFixed(2) }); move(S.adjust, sd(S.adjust).dx, sd(S.adjust).dy); }
    else move(S.adjust, drag.dx + (e.clientX - drag.x) / drag.w * 100, drag.dy + (e.clientY - drag.y) / drag.h * 100);
    live();
  });
  document.addEventListener('pointerup', () => { if (drag) { drag = null; render(true); } });
  document.addEventListener('keydown', e => {
    const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];   // 1% of the flyer a press
    if (!k || !S.adjust || S.st !== 'preview' || e.target.closest?.('textarea, input')) return;
    e.preventDefault(); const d = sd(S.adjust); move(S.adjust, d.dx + k[0], d.dy + k[1]); render(true);
  });
  // From the map: go to a state (the other frame was clicked, or a box in the diagram), show or hide the numbers
  addEventListener('message', e => {
    const m = e.data || {};
    // only the turn changed: the other frame turns too, animated
    const strip = o => JSON.stringify({ ...START, ...o, flipped: 0 });
    if (m.uas === 'go' && m.state.flipped !== S.flipped && strip(m.state) === strip(S) && document.querySelector('.us-flip')) { GO.flip(); return; }
    if (m.uas === 'go') { const prev = S.st; S = { ...START, ...m.state }; render(false); if (S.st !== prev) scrollTo(0, 0); }
    if (m.uas === 'hot') document.body.classList.toggle('hot', !!m.on);
  });
  render(null);
  if (q.get('to')) document.getElementById(q.get('to'))?.scrollIntoView({ block: 'start' });   // the sketch page opens a frame at a block
  parent.postMessage({ uas: 'ready', state: S }, '*');
}
</script>
</body>
