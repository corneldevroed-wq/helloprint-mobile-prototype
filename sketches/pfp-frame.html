  .pf-group { border-bottom: 1px solid var(--line); }

// Prices: the live from-price is the lowest per piece; at 500 a plausible step up (the prototype's own numbers)
const QTY = 500, pce = p => Math.round(p.pp * 1.5 * 100) / 100, total = p => Math.round(pce(p) * QTY * 100) / 100;
// Delivery: today Thu 19 Nov 2026, + working days for the fastest option
const WD = { '1': 1, '2to3': 3, '4to5': 5, 'moreThan6': 7 }, RANK = { '1': 0, '2to3': 1, '4to5': 2, 'moreThan6': 3 };
const addWd = n => { const d = new Date('2026-11-19T12:00'); while (n) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } return d; };
const short = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');

const card = p => `<a class="product" href="#${p.s}">
    <div class="thumb" style="background:var(--light-grey)"><img src="${CF + p.i}?w=500&fm=webp&q=80" alt="" loading="lazy">${badgeHtml(p.b)}</div>
    <p class="name">${p.n}</p>
    <span class="pf-dots" aria-label="${p.hex.length} colours">${p.hex.slice(0, 6).map(h => `<i style="background:${h}"></i>`).join('')}${p.hex.length > 6 ? `<small>+${p.hex.length - 6}</small>` : ''}</span>
    <div><p class="from">${QTY} pcs for</p><p class="prices"><span class="price" data-price="${total(p)}">${fmt(total(p))}</span>${V === 'c' ? `<span class="pf-each">· ${fmt(pce(p))} each</span>` : ''}</p>
    ${V === 'c' ? `<p class="pf-eta">Estimated <b>${p.d === '1' ? 'tomorrow' : short(addWd(WD[p.d]))}</b></p>` : ''}</div>
  </a>`;

// The siblings (Pencils, Highlighters, Writing Sets, Pencil Cases) are other categories: grey tiles under the products. Photo = the first product of
// each live page. The live sub categories of Pens are filters here: Eco Pens = Eco only, Fast Delivery Pens = Delivered by, Luxury / Stylus Pens = Pen
// type, BIC / Parker / … Pens = Brand; their URLs stay (SEO) and open this page with that filter on.
const SIB = [['Pencils', '5faYfcKhgnE3ix0mpTqx5v/3b0eb418eb97519264080863d573847b/topicvarnishedpencil.webp', '#promotional-pencils'],
  ['Highlighters', '6v83dM8FMUhPvliLT5Zq19/170147205b75388b2dc525615fc735c5/bloomhighlighter.webp', '#promotional-highlighters'],
  ['Writing Sets', '6uR46vgiyr8JWpzyADmznI/3ed3fbdcaacae9b5a58c65b7ca087244/bamboosetbamboopenandpencilset.webp', '#writing-sets'],
  ['Pencil Cases', '1gVclVa4cMx1OPTwvgt9gk/69b02d9a88f1d61238dceddff5768b09/flatcasewovenpaperpencilcase.webp', '#pencil-cases']];
const sibEl = document.getElementById('sibCats');
sibEl.innerHTML = SIB.map(([name, img, href]) => DESKV
  ? `<a class="dc-card" href="${href}"><span class="dc-t">${name}</span><img class="dc-go" src="assets/desktop/arrow-forward-grey.svg" alt=""><span class="dc-img"><img src="${CF + img}?w=300&fm=webp&q=80" alt="" loading="lazy"></span></a>`
  : `<a class="cat" href="${href}"><div class="collage"><img src="${CF + img}?w=300&fm=webp&q=80" alt="" loading="lazy" style="inset:0;object-fit:contain"></div><p class="title">${name}</p></a>`).join('');
if (!DESKV) sibEl.classList.add('hscroll', 'cats');

// FILTERS. Pen type first (the first choice, where Luxury / Stylus Pens land; Cornel 2026-11-19), Eco only under it, then in decision order.
// Within a group: any of the ticked values (OR); between groups: all (AND). Delivered by is one choice (the dates include each other).
const COLS = { Blue: '#0000FF', Black: '#000000', White: '#FFFFFF', Green: '#008000', Red: '#FF0000', Grey: '#808080', Orange: '#FFA500', Yellow: '#FFFF00', Pink: '#ffb6e2', Brown: '#C4A484', Purple: '#A020F0', Silver: '#C0C0C0' };
const DEL = ['Fri 20 Nov (tomorrow)', 'Tue 24 Nov', 'Thu 26 Nov'];
const G = [
  { id: 'type', k: 'Pen type', vals: ['Ballpoint pens', 'Stylus pens', 'Writing sets', 'Luxury pens', 'Rollerball pens', 'Fountain pens'], t: (p, v) => p.type.includes(v) },
  { id: 'del', k: 'Delivered by', one: true, vals: DEL, t: (p, v) => RANK[p.d] <= DEL.indexOf(v) },
  { id: 'price', k: 'Price per piece', vals: ['Under €0.25', '€0.25 – €0.50', '€0.50 – €1', 'Over €1'], t: (p, v) => { const e = pce(p); return [e < .25, e >= .25 && e < .5, e >= .5 && e < 1, e >= 1][['Under €0.25', '€0.25 – €0.50', '€0.50 – €1', 'Over €1'].indexOf(v)]; } },
  { id: 'print', k: 'Print', vals: ['Full colour print', '1 to 5 colours', 'Engraving'], t: (p, v) => p.print.includes(v) },
  { id: 'colour', k: 'Colour', sw: true, vals: Object.keys(COLS), t: (p, v) => p.col.includes(v) },
  { id: 'mat', k: 'Material', vals: ['Plastic', 'Recycled plastic', 'Metal', 'Recycled aluminium', 'Bamboo', 'Cardboard'], t: (p, v) => p.mat.includes(v) },
  { id: 'brand', k: 'Brand', vals: ['BIC', 'Parker', 'Marksman', 'Swiss Peak', 'Senator', 'Vinga', 'Waterman', 'Stilolinea'], t: (p, v) => p.brand === v }
];
// State: the ticked values per group, eco, and the order they were set in (for "Remove <last>"). In the URL as &f=type:Stylus pens|eco, so a
// copied link opens the same selection (live: the filter URL; one that equals a sub category, /stylus-pens, is that page).
const SEL = {}; G.forEach(g => SEL[g.id] = new Set()); let ECO = false, ORDER = [];
(Q.get('f') || '').split('|').filter(Boolean).forEach(x => { if (x === 'eco') { ECO = true; ORDER.push(['eco']); return; } const [id, v] = x.split(':'); if (SEL[id]) { SEL[id].add(v); ORDER.push([id, v]); } });
const ok = (p, skip) => (skip === 'eco' || !ECO || p.eco) && G.every(g => g.id === skip || !SEL[g.id].size || [...SEL[g.id]].some(v => g.t(p, v)));
const shown = () => PENS.filter(p => ok(p));
const n = (g, v) => PENS.filter(p => ok(p, g.id) && g.t(p, v)).length;   // what you get when you add this value
const ecoN = () => PENS.filter(p => ok(p, 'eco') && p.eco).length;
const active = () => ORDER.length;

const opt = (g, v) => { const c = n(g, v), on = SEL[g.id].has(v);
  return g.sw ? `<button type="button" style="background:${COLS[v]}" title="${v} (${c})" aria-label="${v}, ${c}" aria-pressed="${on}" data-g="${g.id}" data-v="${v}"${!c && !on ? ' disabled' : ''}></button>`
    : `<label class="check${!c && !on ? ' off' : ''}"><input type="${g.one ? 'radio' : 'checkbox'}" name="${g.id}" data-g="${g.id}" value="${v}"${on ? ' checked' : ''}${!c && !on ? ' disabled' : ''}><span>${v}</span><small>${c}</small></label>`; };
const sum = g => { const s = [...SEL[g.id]]; return s.length ? `<span class="pf-sel">${s.length > 1 ? s.length + ' selected' : s[0]}</span>` : ''; };
const groupsHtml = open => G.map((g, i) => `<details class="pf-group"${open.has(g.id) ? ' open' : ''} data-id="${g.id}"><summary><span>${g.k}${sum(g)}</span><img src="assets/chevron.svg" alt=""></summary>
    ${g.sw ? `<div class="pf-sw">${g.vals.map(v => opt(g, v)).join('')}</div>` : `<div class="pf-opts">${g.vals.map(v => opt(g, v)).join('')}</div>`}</details>
    ${i ? '' : `<div class="pf-eco"><span>Eco-friendly only <small>${ecoN()}</small></span><button class="switch" type="button" role="switch" aria-checked="${ECO}" aria-label="Eco-friendly only" data-eco></button></div>`}`).join('');
const label = ([id, v]) => id === 'eco' ? 'Eco-friendly only' : v;
const pills = () => active() ? `<div class="filter-row pf-active">${ORDER.map(o => `<button class="pill pf-x${DARK ? ' active' : ''}" type="button" data-x="${o.join(':')}">${label(o)}<span class="material-symbols-rounded" aria-hidden="true">close</span></button>`).join('')}<button class="pf-clear" type="button" data-clear>Clear all</button></div>` : '';
const sortPill = '<button class="pill pf-sort" type="button">Most popular</button>';

const R = document.getElementById('results');
const openSide = new Set(['type', 'del', 'price', 'print', 'colour']), openSheetG = new Set(['type', 'del', 'price']);
R.innerHTML = `<div class="pf-layout"><aside class="pf-side" aria-label="Filters"><div class="pf-side-h"><b>Filters</b><button class="pf-clear" type="button" data-clear hidden>Clear all</button></div><div id="side"></div></aside>
  <div class="pf-main" id="main"></div></div>`;
const render = () => {
  const list = shown(), k = active(), all = !k;
  const keep = (sel, set) => { const el = document.querySelector(sel); if (el && el.children.length) { set.clear(); el.querySelectorAll('details[open]').forEach(d => set.add(d.dataset.id)); } };
  keep('#side', openSide); keep('#sheetGroups', openSheetG);
  document.getElementById('side').innerHTML = groupsHtml(openSide);
  document.getElementById('sheetGroups').innerHTML = groupsHtml(openSheetG);
  document.querySelectorAll('.pf-side-h [data-clear]').forEach(b => b.hidden = all);
  const count = all ? 181 : list.length;
  document.getElementById('main').innerHTML = `
    <div class="pf-bar pf-mob"><button class="pill has-icon${k && DARK ? ' active' : ''}" type="button" data-open-sheet="filters"><span class="material-symbols-rounded" aria-hidden="true">tune</span>Filters${k ? (DARK ? `<small>${k}</small>` : `<span class="pf-n">${k}</span>`) : ''}</button>${sortPill}<span class="pf-count" style="margin:0 0 0 auto">${count} products</span></div>
    ${DESKV ? `<div class="pf-bar"><span class="pf-count"><b>${count}</b> products</span>${sortPill}</div>` : ''}
    ${pills()}
    ${list.length ? `<div class="types" id="grid">${list.map(card).join('')}</div>
      <div class="pf-more"><p>Showing ${list.length} of ${count} products</p>${all ? '<a class="btn outline" href="?page=2">Show 24 more</a>' : ''}</div>`
    : `<div class="pf-empty"><b>No pens match all your filters</b><p>Remove the last one, or start again.</p><div class="chips"><button class="pill" type="button" data-x="${ORDER[k - 1].join(':')}">Remove ${label(ORDER[k - 1])}</button><button class="pill" type="button" data-clear>Clear all</button></div></div>`}`;
  document.getElementById('showBtn').textContent = `Show ${count} products`;
  const u = new URL(location.href); if (k) u.searchParams.set('f', ORDER.map(o => o.join(':')).join('|')); else u.searchParams.delete('f'); history.replaceState(null, '', u);
};
// Desktop: a filter works at once; when the grid's top is above the screen, the page goes back to it (the products changed under you).
const changed = () => { render(); const m = document.getElementById('main'); if (DESKV && m.getBoundingClientRect().top < 0) window.scrollTo({ top: m.getBoundingClientRect().top + scrollY - 16, behavior: 'smooth' }); };
const toggle = (id, v) => { if (id === 'eco') { ECO = !ECO; ORDER = ECO ? [...ORDER, ['eco']] : ORDER.filter(o => o[0] !== 'eco'); return changed(); }
  const g = G.find(x => x.id === id), had = SEL[id].has(v);
  if (g.one) { SEL[id].clear(); ORDER = ORDER.filter(o => o[0] !== id); }
  if (had) { SEL[id].delete(v); ORDER = ORDER.filter(o => !(o[0] === id && o[1] === v)); } else { SEL[id].add(v); ORDER.push([id, v]); }
  changed(); };
document.addEventListener('change', e => { const i = e.target.closest('input[data-g]'); if (i) toggle(i.dataset.g, i.value); });
document.addEventListener('click', e => {
  const sw = e.target.closest('.pf-sw button[data-g]'); if (sw) return toggle(sw.dataset.g, sw.dataset.v);
  if (e.target.closest('[data-eco]')) return toggle('eco');
  const x = e.target.closest('[data-x]'); if (x) { const [id, ...v] = x.dataset.x.split(':'); return toggle(id, v.join(':')); }
  if (e.target.closest('[data-clear]')) { G.forEach(g => SEL[g.id].clear()); ECO = false; ORDER = []; changed(); }
});
render();
if (SHEET && !DESKV) setTimeout(() => openSheet('filters'), 300);
</script>
</body>
</html>
