<!-- Sketch frame (not linked), loaded by sketches/orders-sketch.html as ?v=a|b&page=list|detail: My account Orders and Order detail
     in the real account page (account.html's shell). Existing parts: .dash-card/.dash-row/.status/.tracker, .oc-act + .oc-foot, .line-item,
     .totals, .d-menu rows, .pill. New (sketch CSS below): the filter row, a table (B), the error step of the tracker. -->
<style>
  html:not(.desk) .account-side { display: none; }   /* mobile: the account card only on the Overview; a sub page starts with its own title (the breadcrumb leads back) */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters .find { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--outline); border-radius: var(--r-pill); color: var(--dark-grey); font-size: var(--t-14); }
  .desk .filters .find { flex: 0 1 360px; margin-left: auto; order: 2; }
  .filters .pill small { margin-left: 4px; font-weight: 400; }
  /* list: more products in one order = the first photo + "+N" (.art-count, as the cart's artwork) */
  .dash-row .img.more { position: relative; overflow: visible; }
  .dash-row .img.more img { border-radius: inherit; }
  .dash-row .img .art-count { right: -6px; bottom: -6px; border: 1px solid var(--line); }
  /* C: the order confirmed page in the account (.oc-strip, .oc-sec, .oc-acts, .oc-line, .oc-od, .cart-side) */
  .oc-c { display: flex; flex-direction: column; gap: 32px; }
  .oc-c > .oc-strip { margin: 0 -16px; }
  .desk .oc-c > .oc-strip { margin: 0; }
  .oc-pair { display: flex; flex-direction: column; gap: 32px; }   /* Order details with the map, and the order overview next to it (Cornel) */
  .desk .oc-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start; }
  .oc-tot { padding: 16px; }   /* the totals in the same outlined box as the details */
  .oc-tot .totals { border-top: 0; padding-top: 0; }
  .oc-c .oc { padding-bottom: 0; }
  .oc-line .bar .err { background: var(--error); }
  .oc-line .steps .err { color: var(--error); font-weight: 600; }
  .oc-line .bar .done { background: var(--light-green); }
  .tracker li.err { border-top-color: var(--error); color: var(--error); font-weight: 600; }
  .dash-row .t .ref { color: var(--dark-grey); }
  .note-cmp { grid-column: 2 / -1; font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .note-cmp a { color: var(--link); text-decoration: underline; }
  /* B: a table on desktop */
  .tbl { width: 100%; border-collapse: collapse; font-size: var(--t-14); line-height: var(--lh-14); }
  .tbl th { padding: 0 16px 12px 0; text-align: left; font-size: var(--t-12); line-height: var(--lh-12); font-weight: 600; color: var(--dark-grey); border-bottom: 1px solid var(--line); }
  .tbl td { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; padding-bottom: 0; }
  .tbl td b { display: block; font-weight: 600; }
  .tbl td small { font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .od-lines > .oc-sec { margin-top: 16px; }   /* 32 between the products and the order details */
  .tbl .ord { display: flex; align-items: center; gap: 16px; }   /* D: the photo (+N) before the order, as the rows */
  .tbl .ord .img { flex-shrink: 0; display: grid; place-items: center; width: 56px; height: 56px; border-radius: var(--r-m); background: var(--light-grey); }
  .tbl .ord .img img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .tbl .ord .img.more { position: relative; }
  .tbl .ord .art-count { right: -6px; bottom: -6px; border: 1px solid var(--line); }
  .tbl tbody tr:hover { background: var(--light-grey); cursor: pointer; }
  /* detail */
  .od-head { display: flex; flex-direction: column; gap: 4px; }
  .od-head p { font-size: var(--t-14); line-height: var(--lh-14); color: var(--dark-grey); }
  .od-head .back { font-size: var(--t-14); line-height: var(--lh-14); color: var(--link); text-decoration: underline; margin-bottom: 8px; }
  .od-grid { display: flex; flex-direction: column; gap: 24px; }
  .desk .od-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
  .od-lines, .od-side { display: flex; flex-direction: column; gap: 16px; }
  .od-line > .dash-row { grid-template-columns: 56px minmax(0, 1fr) auto; }   /* the price stays right, also on mobile */
  .od-line .amt { font-size: var(--t-14); line-height: var(--lh-14); font-weight: 600; }
  .od-line .tracker { margin-top: 4px; }
  .od-line .msg { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
  .od-line .msg .t { flex: 1; min-width: 200px; display: flex; flex-direction: column; font-size: var(--t-14); line-height: var(--lh-14); }
  .od-line .msg .t b { font-size: var(--t-16); line-height: var(--lh-16); font-weight: 600; }
  .od-line .msg .t small { font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .od-line .msg .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .dash-card.od-line { display: flex; flex-direction: column; gap: 12px; }
  .oc-act.od-line { gap: 12px; }
  .od-side h3 { margin-bottom: 8px; font-size: var(--t-16); line-height: var(--lh-16); font-weight: 600; }
  .od-side .adr { font-size: var(--t-14); line-height: var(--lh-14); color: var(--dark-grey); }
  .od-side .adr b { display: block; margin-top: 12px; font-size: var(--t-12); line-height: var(--lh-12); color: var(--black); font-weight: 600; }
  .od-side .adr b:first-of-type { margin-top: 0; }
  .od-side .d-menu { position: static; width: auto; padding: 0; border: 0; box-shadow: none; }
  .desk .account-page .od-line .btn { flex: none; height: auto; padding: 4px 16px; font-size: var(--t-14); line-height: var(--lh-14); }
  .od-line .btn { flex: 1 0 100%; }
  .desk .od-line .btn { flex: none; }
  .btn.outline.sm { height: auto; padding: 4px 16px; font-size: var(--t-14); line-height: var(--lh-14); }
</style>
</head>

  // D (Cornel 2026-11-17): the cards of A, and under them in the middle column the map + Order details and the team line of order confirmed
