<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Frame</title>
<base href="../prototype/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,download,open_in_new,remove&display=block" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css?v=20261205zzh">
<link rel="stylesheet" href="../design-system/components.css?v=20261205zzh">
<link rel="stylesheet" href="pages.css?v=20261205zzh">
<!-- Sketch frame (not linked), loaded by sketches/proof-sketch.html as ?v=a|b|c: the proof page in the account shell (Cornel 2026-11-17:
     a page of its own, so a reminder email can link to it). Existing parts: the account card, .crumbs, .oc-lead, .oc-foot (the deadline band),
     .btn / .btn.small, .icon-btn + tooltip, .check, .dash-card, the art stage (light grey), .cart-bar + .sheet-bar + .bar-btns (mobile).
     New (sketch CSS below): the viewer toolbar, the file check list. -->
<style>
  .pf-head { display: flex; flex-direction: column; gap: 4px; }
  .pf-head .back { align-self: flex-start; }
  .pf-grid { display: flex; flex-direction: column; gap: 24px; }
  .desk .pf-grid.side { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
  .desk .pf-grid.side .pf-panel { position: sticky; top: 124px; }
  /* the viewer: a PDF viewer (the proof is always a PDF, rendered with pdf.js): a dark toolbar and canvas, the white page with a shadow */
  .viewer { border-radius: var(--r-l); overflow: hidden; background: var(--dark-grey); }
  .viewer .bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--black); font-size: var(--t-14); line-height: var(--lh-14); color: var(--white); }
  .viewer .bar .zoom { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
  .viewer .bar .zoom span { min-width: 48px; text-align: center; }
  .viewer .bar .icon-btn { width: 32px; height: 32px; border-color: transparent; }
  .viewer .stage { height: 480px; overflow: auto; padding: 24px; text-align: center; }
  .desk .viewer .stage { height: 640px; }
  .viewer canvas { display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,.4); background: var(--white); }
  .viewer .links { display: flex; gap: 16px; justify-content: flex-end; padding: 8px 16px; background: var(--black); font-size: var(--t-14); line-height: var(--lh-14); }
  .viewer .links a { color: var(--white); }
  /* the file check: what we did with your file, a check or a dot each */
  .pf-check { display: flex; flex-direction: column; gap: 12px; }
  .pf-check h3 { font-size: var(--t-16); line-height: var(--lh-16); font-weight: 600; }
  .pf-list { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; }
  .pf-check li { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 8px; list-style: none; font-size: var(--t-14); line-height: var(--lh-14); }
  .pf-check li img { width: 20px; height: 20px; margin-top: 1px; }
  .pf-check li .dot { width: 8px; height: 8px; margin: 7px 6px; border-radius: 50%; background: var(--orange); }
  .pf-check li b { font-weight: 600; }
  .pf-check li small { grid-column: 2; font-size: var(--t-12); line-height: var(--lh-12); color: var(--dark-grey); }
  .pf-panel { display: flex; flex-direction: column; gap: 16px; }
  .pf-acts { display: flex; flex-direction: column; gap: 8px; }
  .pf-acts .btn { width: 100%; }
  .pf-acts .note { align-self: center; font-size: var(--t-14); line-height: var(--lh-14); }
  .pf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pf-row .note { margin-left: auto; font-size: var(--t-14); }
  .pf-ticks { display: flex; flex-direction: column; gap: 8px; }
  .pf-band { margin: 0; border-radius: var(--r-m); }
  .btn.primary[disabled] { opacity: .45; }
  html:not(.desk) .pf-acts, html:not(.desk) .pf-row { display: none; }   /* mobile: the buttons in the sticky bar */
  .desk .cart-bar { display: none; }
  html:not(.desk) main { padding-bottom: 96px; }
</style>
</head>
<body data-desktop>
<div class="phone">
  <div data-shell="header"></div>
  <main class="account-page account-sub">
    <p class="crumbs"><a href="index.html">Home</a> / <a href="account.html">My account</a> / <a href="orders.html">Orders</a> / <a href="order.html?o=8839004">Order #8839004</a> / Proof</p>
    <div class="account-grid">
      <div data-account-side></div>
      <div class="account-main" id="main"></div>
    </div>
  </main>
</div>
<div class="cart-bar"><div class="sheet-bar"><div class="bar-btns"><button class="btn outline" type="button">Upload new design</button><button class="btn primary" type="button" id="barApprove">Approve proof</button></div></div></div>
<script>
  window.__tmpUser = !localStorage.getItem('hp-user');
  if (window.__tmpUser) localStorage.setItem('hp-user', JSON.stringify({ first: 'Loraine', last: 'Pijffers', email: 'loraine@example.com' }));
</script>
<script src="app.js?v=20261205zzh"></script>
<script src="account.js?v=20261205zzh"></script>
<script src="../design-system/components.js?v=20261205zzh"></script>
<script>
{
  if (window.__tmpUser) localStorage.removeItem('hp-user');
  const V = new URLSearchParams(location.search).get('v') || 'a';
  document.querySelector('[data-account-side]').outerHTML = accountSide('orders.html');
  const ib = (ic, tip) => `<button class="icon-btn" type="button" data-tip="${tip}" aria-label="${tip}"><span class="material-symbols-rounded" aria-hidden="true">${ic}</span></button>`;
  const head = `<div class="pf-head"><h1>Your proof: Roller Banner</h1><p class="oc-lead">Order #8839004 · 2 pcs · 85 × 200 cm · Premium base</p></div>`;
  const band = `<p class="oc-foot pf-band">Approve by <b>14:00 on Wed 18 Nov</b> to keep your date: Estimated Mon 23 Nov — latest Tue 24 Nov</p>`;
  const PDF = 'assets/proofs/roller-banner.pdf';
  const viewer = `<div class="viewer"><div class="bar"><span id="pdfPages">Page 1 of 1</span><span class="zoom"><span data-z="-1">${ib('remove', 'Zoom out')}</span><span id="pdfZoom">Fit</span><span data-z="1">${ib('add', 'Zoom in')}</span></span>
      <a class="icon-btn" href="${PDF}" target="_blank" data-tip="Open the PDF in a new tab" aria-label="Open the PDF in a new tab"><span class="material-symbols-rounded" aria-hidden="true">open_in_new</span></a>
      <a class="icon-btn" href="${PDF}" download data-tip="Download the proof (PDF)" aria-label="Download the proof (PDF)"><span class="material-symbols-rounded" aria-hidden="true">download</span></a></div>
    <div class="stage" id="pdfStage"><canvas id="pdfCanvas" aria-label="Your proof, page 1"></canvas></div></div>`;
  const check = `<div class="pf-check"><h3>What we did with your file</h3><ul class="pf-list">
    <li><img src="assets/pdp/check.svg" alt=""><b>Colours converted to CMYK</b><small>Print colours can look a little calmer than on screen.</small></li>
    <li><img src="assets/pdp/check.svg" alt=""><b>Resolution is fine</b><small>Sharp at 85 × 200 cm.</small></li>
    <li><span class="dot" aria-hidden="true"></span><b>Text close to the edge</b><small>“tickets at summerfest.example” sits 3 mm from the cut. It may be trimmed.</small></li></ul></div>`;
  const acts = () => `<div class="pf-acts"><button class="btn primary" type="button">Approve proof</button><button class="btn outline" type="button">Upload new design</button><a class="link note" href="#note">Leave a note for our team</a></div>`;
  const help = `<div class="oc-team"><span class="faces"><img src="assets/help/team/saskia.webp" alt=""><img src="assets/help/team/timo.webp" alt=""><img src="assets/help/team/karen.webp" alt=""></span><span>Not sure? Our team checks it with you. <a href="#chat">Start chat</a></span></div>`;
  const ticks = `<div class="pf-check"><h3>Before you approve</h3><div class="pf-ticks">
    <label class="check"><input type="checkbox" data-t>The text and the spelling are right</label>
    <label class="check"><input type="checkbox" data-t>The colours and pictures are as I want them</label>
    <label class="check"><input type="checkbox" data-t>Nothing important sits near the cut edge</label></div></div>`;
  const L = {
    // A: viewer left, the decision on the right (sticky): deadline, the check, the buttons
    a: `${head}<div class="pf-grid side"><div>${viewer}</div><div class="pf-panel">${band}<div class="dash-card">${check}</div>${acts()}${help}</div></div>`,
    // B: as the wishes: the viewer over the full width, everything under it
    b: `${head}${band}${viewer}<div class="dash-card">${check}</div><div class="pf-row"><button class="btn primary small" type="button">Approve proof</button><button class="btn outline small" type="button">Upload new design</button><a class="link note" href="#note">Leave a note for our team</a></div>${help}`,
    // C: as A, but you tick three things before Approve works (it slows you down where a mistake costs a reprint)
    c: `${head}<div class="pf-grid side"><div>${viewer}</div><div class="pf-panel">${band}<div class="dash-card">${check}</div><div class="dash-card">${ticks}</div>${acts()}${help}</div></div>`,
  };
  document.getElementById('main').innerHTML = L[V];
  // the PDF in the viewer (pdf.js, as the upload popup): fit to the stage, zoom in steps of 25%
  const loadPdfJs = () => window.pdfjsLib ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  let pdfPage = null, fit = 1, zoom = 1;
  const draw = async () => {
    const stage = document.getElementById('pdfStage'), cv = document.getElementById('pdfCanvas'), v1 = pdfPage.getViewport({ scale: 1 });
    fit = Math.min((stage.clientWidth - 48) / v1.width, (stage.clientHeight - 48) / v1.height);
    const vp = pdfPage.getViewport({ scale: fit * zoom * devicePixelRatio });
    cv.width = vp.width; cv.height = vp.height; cv.style.width = vp.width / devicePixelRatio + 'px'; cv.style.height = vp.height / devicePixelRatio + 'px';
    await pdfPage.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    document.getElementById('pdfZoom').textContent = zoom === 1 ? 'Fit' : Math.round(zoom * 100) + '%';
  };
  loadPdfJs().then(async () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc = await pdfjsLib.getDocument(new URL(PDF, document.baseURI).href).promise; pdfPage = await doc.getPage(1);   // a full URL: pdf.js does not read <base>
    document.getElementById('pdfPages').textContent = `Page 1 of ${doc.numPages}`; await draw(); }).catch(e => console.error('proof pdf', e));
  document.addEventListener('click', e => { const z = e.target.closest('[data-z]'); if (!z || !pdfPage) return; zoom = Math.max(1, Math.min(4, zoom + +z.dataset.z * .25)); draw(); });
  if (V === 'c') { const go = () => { const all = [...document.querySelectorAll('[data-t]')].every(x => x.checked); document.querySelectorAll('.pf-acts .btn.primary, #barApprove').forEach(b => b.disabled = !all); };
    document.addEventListener('change', go); go(); }
}
</script>
</body>
</html>
