<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Concept Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css">
<!-- Sketch (not linked): a sketch page at 390 and at 1512 side by side, each scrolls on its own. ?src=<page in sketches/>
     (default promo-concept.html), e.g. ?src=template-gaps-sketch.html or ?src=gaa-club-concept.html.
     The desktop frame is a real 1512px viewport, scaled to fit. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 400 var(--t-14)/var(--lh-14) Inter, sans-serif; color: var(--black); background: var(--stage); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 24px; background: var(--white); }
  h1 { font-weight: 800; font-size: var(--t-20); line-height: var(--lh-20); color: var(--dark-green); }
  .bar p { flex: 1; color: var(--dark-grey); }
  .bar a { color: var(--link); font-weight: 600; }
  .views { display: flex; gap: 32px; align-items: flex-start; padding: 24px; }
  .view small { display: block; margin-bottom: 8px; font-weight: 600; color: var(--dark-grey); }
  .frame { overflow: hidden; border-radius: var(--r-xl); background: var(--white); box-shadow: 0 2px 12px rgba(0, 0, 0, .12); }
  .m iframe { display: block; width: 390px; height: 844px; border: 0; }
  .d { flex: 1; min-width: 0; }
  .d .frame { height: calc(900px * var(--s, .6)); }
  .d iframe { display: block; width: 1512px; height: 900px; border: 0; transform: scale(var(--s, .6)); transform-origin: 0 0; }
</style>
</head>
<body>
<div class="bar">
  <h1 id="vTitle">Promo template · concept</h1>
  <p>"Storm damage? New flag": the marketing page sections (hero, usp, products, cardGrid, split, banner, advisor, reviews, faq, related). Turn on "Blocks" inside a frame to see each type and variant.</p>
  <a id="vOpen" href="promo-concept.html?ann=1" target="_blank">Open full page</a>
</div>
<div class="views">
  <div class="view m"><small>Mobile · 390</small><div class="frame"><iframe src="promo-concept.html" title="Mobile"></iframe></div></div>
  <div class="view d" id="desk"><small>Desktop · 1512</small><div class="frame"><iframe src="promo-concept.html" title="Desktop"></iframe></div></div>
</div>
<script>
  // Which page: ?src= (only a page in this folder)
  const src = (new URLSearchParams(location.search).get('src') || '').match(/^[\w-]+\.html$/)?.[0];
  if (src) {
    document.querySelectorAll('iframe').forEach(f => f.src = src);
    document.getElementById('vOpen').href = src;
    document.getElementById('vTitle').textContent = src.replace('.html', '');
    document.querySelector('.bar p').textContent = 'Mobile at 390 and desktop at 1512, each scrolls on its own.';
  }
  // Scale the 1512px desktop frame to the space left next to the phone
  const d = document.getElementById('desk');
  const fit = () => d.style.setProperty('--s', Math.min(1, d.clientWidth / 1512));
  new ResizeObserver(fit).observe(d); fit();
</script>
</body>
</html>
